        ctx.font = sel ? "800 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
                       : "600 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
        ctx.fillStyle = isActive ? "#aed581" : (sel ? "#ffd54a" : "#cfd8dc");
        
        let text = `${item.icon} ${item.label}`;
        if (isActive) text += "  ✓";
        ctx.fillText(text, W / 2, y0 + i * 26);
      }

      ctx.font = "600 9px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
      ctx.fillStyle = "#90a4ae";
      ctx.fillText("Inserisci i tuoi brani in assets/audio/", W / 2, H - 24);
      ctx.fillText("baddie.mp3 / cattiva.mp3 / espanol.mp3", W / 2, H - 12);
    }

    // DIALOG — popup con dedica romantica per Annina
    if (this.current === S.DIALOG) {
      ctx.fillStyle = "rgba(0, 0, 0, 0.82)";
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = "#1e242e";
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(15, 32, W - 30, H - 64, 12);
      else ctx.rect(15, 32, W - 30, H - 64);
      ctx.fill();
      ctx.strokeStyle = "#ff4081";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.fillStyle = "#ff80ab";
      ctx.font = "800 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
      ctx.fillText("❤️ Per la mia Annina ❤️", W / 2, 54);

      ctx.fillStyle = "#eceff1";
      ctx.font = "600 10px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
      const lines = [
        "Questo gioco è fatto",
        "apposta per te,",
        "ricordando i tuoi momenti",
        "da bambina sul Nokia! 📱",
        "",
        "Insieme a te e al tuo",
        "fedele Cacao 🐕",
        "costruirete tra le Montagne,",
        "Palma e sotto i Portici! 🏛️",
        "",
        "da Ale❤️ per Anna❤️",
        "",
        "Tocca lo schermo",
        "per continuare ✨"
      ];
      for (let l = 0; l < lines.length; l++) {
        ctx.fillText(lines[l], W / 2, 80 + l * 14);
      }
    }

    // CLIMB_DONE — scalata completata
    if (this.current === S.CLIMB_DONE) {
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "800 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
      ctx.fillStyle = "#ffd54a";
      ctx.fillText("✨ Scalata Completata! ✨", W / 2, H / 2 + 16);
      ctx.font = "600 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
      if (g.mode === MODE.EMPIRE) {
        const q = g.pieceQuality();
        ctx.fillStyle = CONFIG.HOUSE_QUALITY_COLORS[q];
        ctx.fillText("Pezzo " + CONFIG.HOUSE_QUALITY_NAMES[q] +
                     " (x" + CONFIG.HOUSE_QUALITY_MULT[q] + ")",
                     W / 2, H / 2 + 34);
        ctx.fillStyle = "#cfd8dc"; ctx.font = "600 10px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
        ctx.fillText(g.house.nextDef ? "In consegna: " + g.house.nextDef.label : "",
                     W / 2, H / 2 + 50);
      }
    }

    // RESULTS — vittoria / casetta completata
    if (this.current === S.RESULTS) {
      ctx.fillStyle = "rgba(10, 14, 22, 0.88)";
      ctx.fillRect(0, 0, W, H);

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      let y = 50;
      ctx.fillStyle = "#ffd54a";
      ctx.font = "800 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
      ctx.fillText("🎉 VITTORIA! 🎉", W / 2, y); y += 18;
      ctx.fillStyle = "#ff80ab";
      ctx.font = "italic 700 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
      ctx.fillText("Casetta Completata!", W / 2, y); y += 26;

      if (g.mode === MODE.EMPIRE) {
        ctx.fillStyle = RANK_COLORS[g.rank] || "#aed581";
        ctx.font = "600 10px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
        for (const ln of wrapText(ctx, RANK_NAMES[g.rank] || "Grande Architetto!", W - 30)) {
          ctx.fillText(ln, W / 2, y); y += 13;
        }
        y += 10;
      }

      ctx.fillStyle = "#fff";
      ctx.font = "800 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
      ctx.fillText("Punteggio Totale: " + g.scoreDisplayed, W / 2, y); y += 20;

      ctx.fillStyle = "#cfd8dc";
      ctx.font = "600 10px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
      ctx.fillText("Combo Massima: x" + g.comboMax, W / 2, y); y += 15;
      ctx.fillText("Tempo Bonus: +" + g.timeBonus(), W / 2, y); y += 15;

      if (g.mode === MODE.QUICK) {
        const isNew = g.scoreDisplayed >= g.highScore && g.scoreDisplayed > 0;
        ctx.fillStyle = isNew ? "#aed581" : "#80cbc4";
        ctx.fillText("Miglior Record: " + g.highScore, W / 2, y); y += 15;
      }

      ctx.fillStyle = "#ffd54a";
      ctx.font = "800 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
      ctx.fillText("Tocca o premi Spazio per il Menu", W / 2, H - 24);
    }

    // GAME_OVER — caduta blocchi esaurita
    if (this.current === S.GAME_OVER) {
      ctx.fillStyle = "rgba(20, 8, 8, 0.88)";
      ctx.fillRect(0, 0, W, H);

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      let y = 60;
      ctx.fillStyle = "#ef5350";
      ctx.font = "800 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
      ctx.fillText("💔 PARTITA TERMINATA 💔", W / 2, y); y += 22;

      ctx.fillStyle = "#cfd8dc";
      ctx.font = "600 10px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
      ctx.fillText("Il blocco è caduto troppe volte!", W / 2, y); y += 28;

      ctx.fillStyle = "#ffd54a";
      ctx.font = "800 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
      ctx.fillText("Punteggio Finale: " + g.scoreDisplayed, W / 2, y); y += 20;

      ctx.fillStyle = "#80cbc4";
      ctx.font = "600 10px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
      ctx.fillText("Miglior Record: " + g.highScore, W / 2, y); y += 30;

      ctx.fillStyle = "#ff80ab";
      ctx.font = "800 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
      ctx.fillText("Tocca o premi Spazio per Riprovare", W / 2, H - 24);
    }

    // HUD DI GIOCO — solo negli stati giocati (sopra il mondo, sotto gli overlay).
    if (inPlay || this.current === S.CART || this.current === S.PLACEMENT) this.renderHud(ctx);

    if (!CONFIG.DEBUG) return;

        // HUD di debug (se attivato per sviluppo)
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.font = "9px monospace";
        ctx.fillStyle = "rgba(0,0,0,0.55)";
        const hudH = (this.current === S.SWING) ? 91
                   : (this.current === S.FLY || this.current === S.LAND) ? 91 : 60;
        ctx.fillRect(0, 0, W, hudH);
        ctx.fillStyle = "#9fe";
        const modeName = g.mode === MODE.QUICK ? "QUICK" : g.mode === MODE.EMPIRE ? "EMPIRE" : "—";
        ctx.fillText("mode:" + modeName + "  fps:" + g.fps.toFixed(0) +
                     "  dt:" + g.lastDt.toFixed(0) + "ms", 3, 3);
  }

  /* =======================================================================
     Banner di notifica allerta evento ambientale
     ======================================================================= */
  renderBanner(ctx) {
    const g = this.game;
    if (!g.banner || g.banner.timer <= 0) return;
    const W = 240;
    const alpha = Math.min(1, g.banner.timer / 400);
    const bw = W - 30;
    const bh = 34;
    const bx = 15;
    const by = 28;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = "rgba(10, 14, 24, 0.92)";
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 6);
    else ctx.rect(bx, by, bw, bh);
    ctx.fill();

    ctx.strokeStyle = g.banner.color || "#ffd54a";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.font = "800 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
    ctx.fillStyle = g.banner.color || "#ffd54a";
    ctx.fillText(g.banner.title, W / 2, by + 11);

    ctx.font = "600 9px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
    ctx.fillStyle = "#e0e0e0";
    ctx.fillText(g.banner.subtitle, W / 2, by + 24);

    ctx.restore();
  }

  /* =======================================================================
     HUD DI GIOCO — in alto a schermo intero
     ======================================================================= */
  renderHud(ctx) {
    const g = this.game, W = 240;
    const barH = 22;

    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.fillRect(0, 0, W, barH);

    ctx.textBaseline = "middle";

    // Punteggio, a sinistra.
    ctx.textAlign = "left";
    ctx.fillStyle = "#ffd54a";
    ctx.font = "800 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
    ctx.fillText(String(g.scoreDisplayed), 6, 11);

    // Combo attiva
    if (g.combo > 1 && g.comboTimer > 0) {
      ctx.fillStyle = "#aed581";
      ctx.font = "800 10px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
      ctx.fillText("x" + g.combo, 6 + ctx.measureText(String(g.scoreDisplayed)).width + 6, 11);
    }

    // Badge evento ambientale (centro)
    if (g.envEvent) {
      const ev = g.envEvent;
      let label = "";
      let bCol = "#ffd54a";
      const remSec = Math.max(1, Math.ceil((ev.remaining || 0) / 1000));
      if (ev.type === "earthquake") {
        label = `🌋 SISMA ${remSec}s`;
        bCol = "#ff5252";
      } else if (ev.type === "wind") {
        label = `💨 ${(ev.dir > 0 ? "VENTO ➡️" : "VENTO ⬅️")} ${remSec}s`;
        bCol = "#40c4ff";
      } else if (ev.type === "blizzard") {
        label = `❄️ ${(ev.dir > 0 ? "BUFERA ➡️" : "BUFERA ⬅️")} ${remSec}s`;
        bCol = "#80d8ff";
      } else if (ev.type === "fog") {
        label = `🌫️ ${(ev.dir > 0 ? "NEBBIA ➡️" : "NEBBIA ⬅️")} ${remSec}s`;
        bCol = "#cfd8dc";
      }

      ctx.save();
      ctx.font = "800 9px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
      const tw = ctx.measureText(label).width;
      const pw = tw + 8;
      const px = Math.round((W - pw) / 2);
      const py = 2;
      ctx.fillStyle = "rgba(10, 14, 24, 0.85)";
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(px, py, pw, 18, 4);
      else ctx.rect(px, py, pw, 18);
      ctx.fill();
      ctx.strokeStyle = bCol;
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = bCol;
      ctx.fillText(label, W / 2, 11);
      ctx.restore();
    }

    // Pulsante Touch PAUSA in alto a destra (con barre vettoriali centrate)
    const btnX = W - 24, btnY = 3, btnW = 20, btnH = 16;
    ctx.fillStyle = "rgba(255, 255, 255, 0.14)";
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(btnX, btnY, btnW, btnH, 4);
    else ctx.rect(btnX, btnY, btnW, btnH);
    ctx.fill();
    ctx.strokeStyle = "rgba(255, 213, 74, 0.6)";
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.fillStyle = "#ffd54a";
    ctx.fillRect(btnX + 5, btnY + 4, 3, 8);
    ctx.fillRect(btnX + 12, btnY + 4, 3, 8);

    // Tempo rimanente della scalata (Empire mode)
    if (g.timeLimitMs > 0) {
      const left = Math.max(0, g.timeLimitMs - g.climbElapsed);
      const s = Math.ceil(left / 1000);
      ctx.textAlign = "right";
      ctx.fillStyle = left > 0 ? "#cfd8dc" : "#ef5350";
      ctx.font = "600 10px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
      ctx.fillText(Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"), btnX - 6, 11);
    }

    // Errori / Vite: mostrati SOLO nella modalità Empire (Costruisci la casetta), NON in Quick!
    if (g.mode === MODE.EMPIRE) {
      const r = 3, gap = 9, x0 = 6;
      for (let i = 0; i < CONFIG.MAX_MISSES; i++) {
        ctx.beginPath();
        ctx.arc(x0 + i * gap, barH + 7, r, 0, Math.PI * 2);
        if (i < g.misses) { ctx.fillStyle = "#ef5350"; ctx.fill(); }
        else { ctx.strokeStyle = "rgba(255,255,255,0.45)"; ctx.lineWidth = 1; ctx.stroke(); }
      }
    }

    // Cariche di double-fly
    if (g.doubleFlyCharges > 0 && g.doubleFlyUnlocked) {
      ctx.textAlign = "right";
      ctx.fillStyle = "#9cf";
      ctx.font = "10px monospace";
      ctx.fillText("2x " + g.doubleFlyCharges, W - 6, barH + 7);
    }
    ctx.lineWidth = 1;
  }
}

/* =========================================================================
   Worker — operaio/gru con blocco appeso (ARCH §2, SPEC §3).
   Possiede la FASE di swing; calcola la posizione orizzontale del blocco
   appeso via tabella seno a 256 campioni interpolata. Update SOLO in SWING.
   Sistema 3: NIENTE lancio (quello è SWING->FLY, sistema successivo).
   Mappa metodi originali: j.a(int,int,int) 1640, j.m104b/m105c 3099-3113,
   j.m89k 1587, wrap fase j.a(...) 1611-1617.
   ========================================================================= */
class Worker {
  constructor(game, opts = {}) {
    this.game = game;
    this.sine = CONFIG.SINE_TABLE || buildSineTable(); // f220a (DA STIMARE se null)
    // Fase iniziale SEMINATA dal dump (controfase per-operaio). phase0 persiste: reset()
    // riparte da qui, non da 0, così la relazione di controfase tra operai è preservata.
    this.phase0 = opts.phase0 || 0;
    this.phase  = this.phase0;                 // bVar.f: fase swing, wrap a SWING_PHASE_CYCLE
    this.amp    = CONFIG.SWING_AMP_DEFAULT;    // ampiezza attiva (92 base; 97 cima; 57 c==3 Quick)
    // Sistema 6: `s` (velocità di swing, SPEC §3). Mutata dagli esiti di presa (§5);
    // PERSISTE tra un lancio e l'altro (reset() NON la azzera). Modula la velocità di
    // oscillazione: l'esito di QUESTO blocco rende più facile/difficile il PROSSIMO.
    this.swingSpeed = (this.game && this.game.mode === MODE.QUICK)
      ? (this.game.quickSwingSpeed || CONFIG.SWING_SPEED_INIT)
      : CONFIG.SWING_SPEED_INIT;
    this.angle  = 0;                           // angolo 16-bit corrente (debug)
    this.offset = 0;                           // offset orizzontale corrente (px-scala)
    // Sistema 7 (RIFATTO): posizione in COORDINATE MONDO. worldY = -index*TILE: la torre
    // cresce verso y negativi, la camera decide cosa si vede. `index` = posizione in catena.
    this.index  = opts.index || 0;
    this.worldY = opts.worldY != null ? opts.worldY : 0;
    // Sistema 15: orologio d'animazione dello sprite. Indipendente dalla fase di swing
    // (le durate dei frame vengono dal descrittore originale, non dall'oscillazione).
    this.animMs = 0;
    this.role   = opts.role || "normale";      // "ricevitore" (ultimo) / "cima" (i 5 alti)
    this.cls    = opts.cls || 0;               // classe visuale normalizzata (3 = asino)
    this._applyPhase();                        // offset/angolo iniziali dalla fase seminata
  }

  // Deriva angolo+offset dalla fase corrente (senza avanzare il tempo). Usato all'init e
  // in reset(): gli operai fermi mostrano subito la loro fase (zig-zag di controfase).
  _applyPhase() {
    this.angle = Math.floor((this.phase * 256) / CONFIG.PHASE_TO_ANGLE_DIV) & 0xffff;
    this.offset = (this._sineInterp(this.angle) * this.amp) >> 10;
  }

  // Y SCHERMO del bordo alto del blocco appeso: mondo - camera. Tutta la fisica di
  // volo/presa (sistemi 4-6) continua a lavorare in pixel schermo, invariata.
  get blockY() { return this.worldY - this.game.cameraY; }

  // Centro X/Y schermo del blocco appeso: punto di partenza del lancio (Sistema 4).
  blockCenterX(canvasW) { return (canvasW >> 1) + this.offset; }
  blockCenterY() { return this.blockY + (CONFIG.TILE >> 1); }

  // Velocità di swing istantanea (px-scala, segnata), = coseno della fase: la
  // posizione è seno(angolo), quindi la velocità ∝ coseno = m106d = seno sfasato di
  // un quarto (64 campioni = angolo+0x4000). [SPEC §3 m106d]. Determina verso e
  // modulo orizzontali del lancio (il blocco parte NELLA direzione del moto).
  swingVel() { return (this._sineInterp((this.angle + 0x4000) & 0xffff) * this.amp) >> 10; }

  /* --- ANCORA e geometria di presa/rilascio (SPEC §14) --------------------------------
     L'ancora è l'origine a cui sono riferite WORKER_HANDS e WORKER_CATCH_BOX. */

  // X dell'ancora: centro di oscillazione + offset di swing. [LETTO SPEC §14.5 b(w)]
  anchorX(canvasW) { return (canvasW >> 1) + this.offset; }

  // Y MONDO dell'ancora. [LETTO j.class q() offset 17-55]
  //   ancora(i) = workerWorldY(i) - 9        (classe 2: workerWorldY(i) - h(i), cioe' l'argano
  //   sta alla quota del RICEVENTE i+1; il corpo pende sotto, vedi poseOriginWorldY)
  anchorWorldY() {
    if (this.cls === CONFIG.CLASS_MONKEY) return this.worldY - this.game.chain.stepY(this.index);
    return this.worldY + CONFIG.WORKER_ANCHOR_DY;
  }

  // ORIGINE delle tabelle = b(w) di SPEC §14.5: l'ancora per tutte le classi, la posizione
  // POLARE del corpo per la classe 2 (che pende dall'argano con raggio 63).
  // [LETTO j.class a(Lb;) offset 0-48] `ang = w.e/10;`
  //   `e[0] = w.a - ((sin(ang)*63)>>10);  e[1] = w.b + ((cos(ang)*63)>>10);`
  //   sin/cos = tabella `a:[S`, 256 voci, scala 1024 [LETTO b(int)/d(int) offset 10695/10731].
  // [DA STIMARE] solo l'ANGOLO: `w.e` non ha un corrispettivo determinato nel clone
  //   (fase vs velocità). Qui si fissa cos(ang)=1, cioè corpo a ancora+63, fune verticale.
  //   Non è il caso peggiore in assoluto — è il più basso, quindi pessimo se la scimmia
  //   lancia e ottimo se riceve — ma la coincidenza esatta coi flag b[i][4] (SPEC §14.4)
  //   regge con questa scelta.
  poseOriginX(canvasW) { return this.anchorX(canvasW); }
  poseOriginWorldY() {
    const a = this.anchorWorldY();
    return (this.cls === CONFIG.CLASS_MONKEY) ? a + CONFIG.MONKEY_ROPE_RADIUS : a;
  }

  // Selettore di POSA/DIREZIONE, trascrizione di `a(b w)`. [LETTO SPEC §9.2]
  //   d = stato rispetto al blocco: 0 = lo attende, 1 = ce l'ha, 2 = l'ha passato.
  //   bit basso = DIREZIONE. Nell'originale è `w.g >= 0`; nel clone il corrispettivo
  //   naturale è il segno della velocità di swing. [DEDOTTO]
  poseSlot(d) {
    let slot = 0;
    if (d === 0) slot = 2;
    else if (d === 2) slot = 4;
    if (this.swingVel() >= 0) slot |= 1;
    if (this.cls === CONFIG.CLASS_SLEDGE) slot >>= 1;   // classe 4: 2 soli slot
    return slot;
  }

  // Riga della tabella per la posa richiesta, con CLAMP: la classe 4 ha solo 2 slot,
  // quindi uno slot fuori range viene riportato all'ultimo disponibile. [LETTO SPEC §9.2]
  _tableRow(table, d) {
    const row = table[this.cls] || table[0];
    const slot = Math.min(this.poseSlot(d), row.length - 1);
    return row[slot];
  }

  // Punto MANI in coordinate SCHERMO (px): origine posa + WORKER_HANDS. [LETTO SPEC §14.1]
  handsX(canvasW, d) {
    if (CONFIG.THEME === 'custom') {
      if (this.cls === CONFIG.CLASS_SLEDGE || this.role === 'ricevitore') {
        return this.poseOriginX(canvasW) + 16;
      }
      if (this.cls === CONFIG.CLASS_DONKEY) {
        return this.poseOriginX(canvasW) - 2;
      }
    }
    return this.poseOriginX(canvasW) + Physics.toPx(this._tableRow(CONFIG.WORKER_HANDS, d)[0]);
  }
  handsWorldY(d) {
    if (CONFIG.THEME === 'custom') {
      if (this.cls === CONFIG.CLASS_SLEDGE || this.role === 'ricevitore') {
        return this.poseOriginWorldY() - 20;
      }
      if (this.cls === CONFIG.CLASS_DONKEY) {
        return this.poseOriginWorldY() - 24;
      }
    }
    return this.poseOriginWorldY() + Physics.toPx(this._tableRow(CONFIG.WORKER_HANDS, d)[1]);
  }

  // BOX DI PRESA in px, coordinate MONDO: {x,y,w,h}. [LETTO SPEC §14.1/§14.5]
  catchBox(canvasW, d) {
    if (CONFIG.THEME === 'custom') {
      if (this.cls === CONFIG.CLASS_SLEDGE || this.role === 'ricevitore') {
        return {
          x: this.poseOriginX(canvasW) - 8,
          y: this.poseOriginWorldY() - 38,
          w: 54,
          h: 38,
        };
      }
      if (this.cls === CONFIG.CLASS_DONKEY) {
        return {
          x: this.poseOriginX(canvasW) - 22,
          y: this.poseOriginWorldY() - 36,
          w: 44,
          h: 36,
        };
      }
    }
    const b = this._tableRow(CONFIG.WORKER_CATCH_BOX, d);
    return {
      x: this.poseOriginX(canvasW) + Physics.toPx(b[0]),
      y: this.poseOriginWorldY()   + Physics.toPx(b[1]),
      w: Physics.toPx(b[2]),
      h: Physics.toPx(b[3]),
    };
  }

  /* --- Sistema 15: SPRITE REALE dell'operaio -------------------------------------------
     Origine = la stessa `poseOrigin` a cui sono riferite WORKER_HANDS e WORKER_CATCH_BOX
     (SPEC §14): l'ancora per le classi 0/1/3/4, la posizione POLARE del corpo per la
     classe 2. Slot e direzione vengono da `poseSlot(d)`: gli slot pari/dispari SONO le
     due direzioni, quindi non serve alcuno specchiamento. */
  renderSprite(ctx, d) {
    if (CONFIG.THEME === 'custom') {
      const ox = this.poseOriginX(240);
      const oy = this.poseOriginWorldY() - this.game.cameraY;
      
      if (this.cls === CONFIG.CLASS_DONKEY) {
        // CACAO IL LABRADOR
        let im = null;
        let dw = 48, dh = 28, dy = -25;
        if (d === 1) {
          const f = Math.floor(this.animMs / 140) % 4;
          im = Assets.custom.cacaoWalk[f];
        } else if (d === 0) {
          const f = Math.floor(this.animMs / 250) % 4;
          im = Assets.custom.cacaoWait[f] || Assets.custom.cacaoSit[f];
        } else {
          const f = Math.floor(this.animMs / 120) % 4;
          im = Assets.custom.cacaoJump[f];
          dw = 48; dh = 36; dy = -34;
        }
        if (im && im.complete && im.naturalWidth > 0) {
          ctx.drawImage(im, Math.round(ox - dw/2), Math.round(oy + dy), dw, dh);
          return;
        }
      } else if (this.cls === CONFIG.CLASS_SLEDGE) {
        // ANNA CON CARRELLO/SLITTA IN CIMA (CLASSE 4)
        const f = Math.floor(this.animMs / 130) % 4;
        const im = Assets.custom.annaCart[f] || Assets.custom.annaCheer;
        const dw = 76, dh = 48, dy = -47;
        if (im && im.complete && im.naturalWidth > 0) {
          ctx.drawImage(im, Math.round(ox - dw/2), Math.round(oy + dy), dw, dh);
          return;
        }
      } else {
        // ANNA (CLASSI 0, 1, ECC.)
        let im = null;
        let dw = 30, dh = 40, dy = -39;
        if (d === 1) {
          im = Assets.custom.annaHold;
          dw = 32; dh = 40;
        } else if (d === 0) {
          im = Assets.custom.annaWait;
          dw = 28; dh = 40;
        } else {
          im = Assets.custom.annaCheer;
          dw = 32; dh = 42; dy = -41;
        }
        if (im && im.complete && im.naturalWidth > 0) {
          ctx.drawImage(im, Math.round(ox - dw/2), Math.round(oy + dy), dw, dh);
          return;
        }
      }
    }

    const cls = SPRITES.chars[this.cls] ? this.cls : 0;
    const rows = SPRITES.chars[cls].s;
    const anim = rows[Math.min(this.poseSlot(d), rows.length - 1)];
    const ox = this.poseOriginX(240);
    const oy = this.poseOriginWorldY() - this.game.cameraY;

    // --- LAYER GAMBE (classi 0 e 1, solo con il blocco in mano) ------------------------
    let bodyFrame = animFrameAt(anim, this.animMs);
    if (d === 1 && (cls === CONFIG.CLASS_LEGS_A || cls === CONFIG.CLASS_LEGS_B)) {
      const back = this.swingVel() < 0;
      const legs = SPRITES.acc[(cls === CONFIG.CLASS_LEGS_A) ? (back ? "gambe0_dx" : "gambe0_sx")
                                                             : (back ? "gambe1_dx" : "gambe1_sx")];
      drawAnimFrame(ctx, legs, animFrameAt(legs, this.animMs), ox, oy, false);
      const e32 = this.amp ? Math.round(this.offset * CONFIG.BOB_OFFSET / this.amp) : 0;
      bodyFrame = Math.floor(((e32 + CONFIG.BOB_OFFSET) * anim.f.length) / CONFIG.BOB_DIV);
    }
    drawAnimFrame(ctx, anim, bodyFrame, ox, oy, false);
    if (this.cls === CONFIG.CLASS_MONKEY) {
      const acc = (d === 1) ? SPRITES.acc.argano_blocco : SPRITES.acc.argano;
      drawAnimFrame(ctx, acc, animFrameAt(acc, this.animMs),
                    this.anchorX(240), this.anchorWorldY() - this.game.cameraY, false);
    }
  }

  // Ingresso SWING: riparte la fase. NON tocca swingSpeed: l'effetto della presa
  // precedente (Sistema 6) deve sopravvivere al nuovo swing.
  reset() { this.phase = this.phase0; this.amp = CONFIG.SWING_AMP_DEFAULT; this._applyPhase(); }

  // Sistema 6 — finestre di timing: applica a `s` l'effetto della categoria di
  // presa (SPEC §5, j.m86j 1288-1308). PERFETTO rallenta (più facile), MEDIO/BORDO
  // accelerano (più difficile). MISS non passa di qui: è gestita come errore (S.MISS).
  applySwingEffect(quality) {
    switch (quality) {
      case CONFIG.QUALITY_PERFECT: this.swingSpeed += CONFIG.PERFECT_SPEED_DELTA;     break; // s -= 15
      case CONFIG.QUALITY_MID:     this.swingSpeed += CONFIG.SWING_INC_MID_R  >> 13;  break; // s += r>>13
      case CONFIG.QUALITY_EDGE:    this.swingSpeed += CONFIG.SWING_INC_EDGE_Q >> 13;  break; // s += q>>13
    }
    // clamp |s| in [MIN, CAP] (SPEC §3: clampata a ±f251m[2]).
    this.swingSpeed = Math.max(CONFIG.SWING_SPEED_MIN,
                      Math.min(CONFIG.SWING_SPEED_CAP, this.swingSpeed));
  }

  // m105c: seno interpolato LINEARMENTE su angolo a 16 bit. [j.m105c 3099-3113]
  //   hi = angolo>>8 (indice campione 0..255), frac = angolo&255 (frazione).
  //   (seno[hi+1]*frac + seno[hi]*(256-frac)) >> 8.
  _sineInterp(angle16) {
    const hi   = (angle16 >> 8) & 255;
    const frac = angle16 & 255;
    const lo   = this.sine[hi];
    const nx   = this.sine[(hi + 1) & 255];   // m104b: indice mascherato a 256
    return (nx * frac + lo * (256 - frac)) >> 8;
  }

  effectiveSwingSpeed() {
    if (this.game && this.game.mode === MODE.QUICK) {
      return this.swingSpeed || this.game.quickSwingSpeed || CONFIG.SWING_SPEED_INIT;
    }
    return CONFIG.SWING_SPEED_INIT;
  }

  // Classe 3 ("asino") NON attiva: continua a oscillare a METÀ velocità mentre aspetta il
  // blocco (`if (i3 == 0) return v >> 1`). Gli operai normali restano FERMI: `i3 != 1 -> 0`.
  // [LETTO j.i(int) 436-453 / SPEC §3]
  updateIdle(dt) {
    this.animMs += dt;
    this.phase += (dt * CONFIG.SWING_PHASE_SPEED * this.effectiveSwingSpeed() / CONFIG.SWING_SPEED_INIT)
                  / (1 << CONFIG.CLASS3_IDLE_SPEED_SHIFT);
    this.phase %= CONFIG.SWING_PHASE_CYCLE;
    this._applyPhase();
  }

  // SWING: fase += dt*velocità (wrap mod ciclo); fase->angolo->offset orizzontale.
  update(dt) {
    this.animMs += dt;
    const effSpeed = this.effectiveSwingSpeed();

    // Irregolarità Terremoto (shuddering e micro-scatti sismici)
    let jitter = 0;
    if (this.game.envEvent && this.game.envEvent.type === "earthquake") {
      const tNow = Date.now();
      const seismicWave = Math.sin(tNow * 0.012) * 22 + Math.sin(tNow * 0.005) * 35;
      jitter = seismicWave + (Math.random() - 0.5) * 26;
    }

    // Avanzamento + wrap del ciclo completo. [j.a(...) 1611-1617]
    this.phase += dt * CONFIG.SWING_PHASE_SPEED * (effSpeed + jitter) / CONFIG.SWING_SPEED_INIT;
    this.phase = (this.phase + CONFIG.SWING_PHASE_CYCLE) % CONFIG.SWING_PHASE_CYCLE;
    this.angle = Math.floor((this.phase * 256) / CONFIG.PHASE_TO_ANGLE_DIV) & 0xffff;
    this.offset = (this._sineInterp(this.angle) * this.amp) >> 10;
  }

  // Render layer #4 (ARCH §2.2): gru/operaio + blocco appeso.
  render(ctx) {
    if (CONFIG.DEBUG) {
      const cx = 120;                          // centro di oscillazione
      const pivotY = this.blockY - 40;         // sommità gru (perno), relativa al livello
      const workerY = this.blockY - 26;        // operaio/trolley, relativo al livello
      ctx.fillStyle = "#8d6e63";
      ctx.fillRect(cx - 30, pivotY - 4, 60, 4);
      ctx.strokeStyle = "#cfd8dc";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx, pivotY);
      ctx.lineTo(cx + this.offset, workerY);   // posizione oscillante
      ctx.stroke();
    }

    // Operaio: sprite reale, posa d == 1 (ha il blocco).
    this.renderSprite(ctx, 1);

    // Blocco appeso: frame del poligono corrente (d.i = releaseSlot del blocco in mano).
    const slot = blockSlotForOffset(this.offset, this.amp);
    const hx = this.handsX(240, 1);
    const hy = this.handsWorldY(1) - this.game.cameraY;
    if (CONFIG.THEME === 'custom') {
      const isPalma = (this.game.scenario === 'palma');
      const isBologna = (this.game.scenario === 'bologna');
      const bImg = isPalma ? Assets.custom.blocksPlanks[slot]
                 : isBologna ? Assets.custom.blocksBologna[slot]
                 : Assets.custom.blocksBrick[slot];
      if (bImg && bImg.complete && bImg.naturalWidth > 0) {
        ctx.drawImage(bImg, Math.round(hx - 24), Math.round(hy - 15));
      } else {
        drawAnimFrame(ctx, SPRITES.block, slot, hx, hy, false);
      }
    } else {
      drawAnimFrame(ctx, SPRITES.block, slot, hx, hy, false);
    }
  }

  // Sistema 5 — render dell'OPERAIO SUPERIORE che riceve il blocco.
  renderCatcher(ctx) {
    if (CONFIG.DEBUG) {
      const W = 240, t = CONFIG.TILE;
      const cx = 120 + this.offset;            // centro oscillante del box di presa
      const by = this.blockY;                  // bordo alto del box
      ctx.strokeStyle = "rgba(255,213,74,0.35)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, by + t + 16); ctx.stroke();
      const box = this.catchBox(W, 0);
      ctx.strokeStyle = "#ffd54a"; ctx.lineWidth = 2;
      ctx.strokeRect(box.x, box.y - this.game.cameraY, box.w, box.h);
    }

    // Operaio: sprite reale, posa d == 0 (attende il blocco).
    this.renderSprite(ctx, 0);
    ctx.lineWidth = 1;
  }
}

/* =========================================================================
   Physics — matematica PURA del proiettile (ARCH §2 "Physics", SPEC §4).
   Stateless: niente stato proprio, solo formule. Tutte le quantità di volo
   sono in UNITÀ INTERNE (fixed-point come l'originale); la conversione px<->
   interno usa d(x,y)/m() della SPEC §4: interno = px*139264/23.
   Mappa metodi originali: j.m86j 1227-1228 (volo), j.p() 1506-1556 (lancio).
   ========================================================================= */
const Physics = {
  // d(x,y): px -> unità interne ; m(): interno -> px. [SPEC §4 righe 1428-1434]
  toInternal(px) { return Math.round(px * CONFIG.PX_TO_INTERNAL / CONFIG.TILE); },
  toPx(internal) { return internal * CONFIG.TILE / CONFIG.PX_TO_INTERNAL; },

  // v0y del lancio dalla CLASSE DELL'OPERAIO LANCIATORE `e[d].c` (negativo = verso l'alto).
  // [LETTO javap j.p() offset 104-159]. NON dipende dal tipo di blocco.
  v0yForClass(cls) {
    const v = CONFIG.V0Y_BY_CLASS[cls];
    if (v !== undefined) return v;
    // Classe senza valore proprio: nell'originale sarebbe solo la 4, che pero' non lancia
    // mai [j.p() offset 83-92]. Se ci arriviamo e' un bug del clone: lo rendiamo visibile
    // invece di nasconderlo dietro un default silenzioso.
    console.warn("[v0yForClass] classe lanciatore senza valore proprio: " + cls +
                 " -> uso il valore d'inizializzazione di j.p():104 (" + CONFIG.V0Y_DEFAULT + ")");
    return CONFIG.V0Y_DEFAULT;
  },

  // v0x dall'offset di rilascio (f214d.i) entro la larghezza W del blocco. [SPEC §4]
  //   i[4] = ((((-(W>>1)+f214d.i) * (4194304/W)) >> 16) * 5950) >> 8
  // Fixed-point intero come il sorgente: il verso/modulo dipendono da DOVE si
  // rilascia nello swing (centro -> 0, estremi -> max).
  v0x(relOffset, W) {
    const norm = Math.floor(CONFIG.V0X_NORM / W);   // 4194304 / W
    const a = (-(W >> 1) + relOffset) * norm;       // (-(W>>1)+f214d.i) * (...)
    return ((a >> 16) * CONFIG.V0X_FACTOR) >> 8;    // (... >>16) * 5950 >> 8
  },

  // Istante dell'apice i5 = (-v0y*1000)/g (v verticale = 0). [SPEC §4 riga 1215]
  apexT(v0y) { return Math.floor((-v0y * 1000) / CONFIG.GRAVITY); },

  // y(t) = v0y*t + (g*(t*t/1000))/2 + y0  — PARABOLA. [SPEC §4, j.m86j 1227]
  y(t, v0y, y0) {
    return v0y * t + Math.floor(CONFIG.GRAVITY * Math.floor(t * t / 1000) / 2) + y0;
  },
  // x(t) = x0 + v0x*t — orizzontale LINEARE. [SPEC §4, j.m86j 1228]
  x(t, v0x, x0) { return x0 + v0x * t; },

  // Sistema 5 — PRESA e QUALITÀ (centratura SPAZIALE, non temporale). [SPEC §5, j.m86j 1268-1308]
  //   offsetPx = i23 = i10 - (boxX + halfW)  -> scostamento del blocco dal centro box
  //   iAbs     = |i23| * 100 / halfW         -> % di scostamento (0% = centrato)
  //   sogliaCenter = CENTER_BASE + (|swingVel|*CENTER_FACTOR)/swingMax   (PERFETTO)
  //   sogliaEdge   = EDGE_BASE   + (|swingVel|*EDGE_FACTOR)/swingMax     (BORDO)
  // Le soglie si ALLARGANO con la velocità di swing (rubber-band): più dondola, più
  // tolleranza. swingVel = f214d.e (velocità di rilascio del blocco); swingMax = f251m[2]
  // (velocità di swing del livello). Qui swingMax = ampiezza di rilascio dell'operaio
  // -> |swingVel|/swingMax ∈ [0,1] (f251m[2] reale dai dati livello = DA STIMARE).
  // La presa esiste solo se i due box si SOVRAPPONGONO (test AABB a(...)); altrimenti MISS.
  catchQuality(offsetPx, halfW, blockHalf, swingVel, swingMax) {
    const absOff = Math.abs(offsetPx);
    if (absOff >= halfW + blockHalf) {                       // nessuna sovrapposizione -> MISS
      return { caught: false, quality: CONFIG.QUALITY_MISS, iAbs: Infinity, center: 0, edge: 0 };
    }
    const av = Math.abs(swingVel);
    const sm = swingMax || 1;
    const center = CONFIG.CENTER_BASE + Math.floor(av * CONFIG.CENTER_FACTOR / sm);
    const edge   = CONFIG.EDGE_BASE   + Math.floor(av * CONFIG.EDGE_FACTOR   / sm);
    const iAbs   = Math.floor(absOff * 100 / halfW);
    let quality;                                             // ordine tabella SPEC §5
    if (iAbs >= edge)        quality = CONFIG.QUALITY_EDGE;     // i24=0, mult 2
    else if (iAbs < center)  quality = CONFIG.QUALITY_PERFECT;  // i24=2, mult 3, combo
    else                     quality = CONFIG.QUALITY_MID;      // i24=1, mult 3
    return { caught: true, quality, iAbs, center, edge };
  },

  // Test AABB a 8 argomenti — il `a(...)` dell'originale. [LETTO SPEC §14.5]
  overlap(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx + bw && bx < ax + aw && ay < by + bh && by < ay + ah;
  },

  // Mezza larghezza REALE del blocco rispetto al suo punto di riferimento, per l'indice
  // di rilascio dato: max(|minX|,|maxX|) sul poligono BLOCK_POLY. [DEDOTTO]
  // Serve alla qualità di presa (§5): il poligono non è simmetrico rispetto all'origine
  // quando è inclinato a gradini, e questa è l'estensione che garantisce che un overlap
  // già accertato non venga riclassificato come MISS dalla guardia di catchQuality.
  blockPolyHalfWidth(slot) {
    const poly = CONFIG.BLOCK_POLY[slot] || CONFIG.BLOCK_POLY[CONFIG.RELEASE_OFFSET_SLOTS >> 1];
    let ext = 0;
    for (let k = 0; k < poly.length; k += 4) {
      ext = Math.max(ext, Math.abs(poly[k]), Math.abs(poly[k] + poly[k + 2]));
    }
    return this.toPx(ext);
  },
};

/* =========================================================================
   StoneBlock — blocco attivo (ARCH §2 "StoneBlock", f214d).
   Sistema 4: stati SWING (appeso, gestito da Worker) e FLY (proiettile via
   Physics). LAND (assestamento) e la PRESA arriveranno nei sistemi successivi:
   per ora il blocco atterra in un PUNTO FISSO sopra (nessuna collisione).
   Mappa: lancio j.p() 1506-1556 ; integrazione volo j.m86j 1200-1228.
   ========================================================================= */
class StoneBlock {
  constructor(game) {
    this.game = game;
    this.active = false;
    this.throwerCls = 0;           // e[d].c: CLASSE dell'operaio che ha lanciato -> sorgente di v0y
    this.x0 = 0; this.y0 = 0;      // posizione iniziale (unità interne)
    this.v0x = 0; this.v0y = 0;    // velocità iniziali (i[4], i[0])
    this.t = 0;                    // i[3]: ms trascorsi nel volo
    this.apex = 0;                 // i5: istante dell'apice
    this.xPx = 0; this.yPx = 0;    // posizione corrente in px (render)
    // Sistema 5: stato della PRESA dall'operaio superiore (SPEC §5).
    this.releaseVel = 0;           // f214d.e: velocità di swing al rilascio (per le soglie)
    this.releaseAmp = 1;           // ampiezza al rilascio (normalizza |swingVel|; ~ f251m[2])
    this.releaseSlot = CONFIG.RELEASE_OFFSET_SLOTS >> 1;  // d.i in 0..10: indice di BLOCK_POLY
    this.catchTested = false;      // la finestra di presa è già stata valutata?
    this.caught = false;           // presa riuscita -> ferma il blocco sul box
    this.fell   = false;           // mancata -> il blocco cade fuori schermo
    this.quality = -1;             // QUALITY_* dell'esito (-1 = non ancora risolto)
    this.iAbs = -1;                // % di scostamento dal centro (debug/calibrazione)
    this.qCenter = 0; this.qEdge = 0; // soglie correnti (debug/calibrazione)
  }

  get resolved() { return this.caught || this.fell; }

  // Lancio (j.p()): al comando d'azione cattura la posizione dell'operaio e
  // l'offset di rilascio dello swing -> parametri del proiettile.
  launch(launchPxX, launchPxY, releaseOffset, amp, throwerCls) {
    this.throwerCls = throwerCls;
    this.t      = 0;
    this.catchTested = false;
    this.caught = false; this.fell = false;
    this.quality = -1; this.iAbs = -1;
    this.v0y    = Physics.v0yForClass(throwerCls);       // i[0] dalla classe del LANCIATORE e[d].c
    this.x0     = Physics.toInternal(launchPxX);         // i[2] = x0
    // Sistema 7/8 (mondo): il volo è ancorato al MONDO, non allo schermo. Se la camera
    // pana durante il volo, il blocco resta solidale alla torre (le formule non cambiano:
    // si somma/sottrae solo l'offset di camera all'ingresso/uscita).
    this.y0     = Physics.toInternal(launchPxY + this.game.cameraY);   // i[1] = y0 (mondo)
    // f214d.i = offset di rilascio mappato sulla larghezza W del blocco [0..W].
    // W = larghezza blocco in unità interne (1 tile = 23px = 139264 interno).
    // releaseOffset (px-scala) ∈ [-amp,+amp] -> rel ∈ [0,W]; centro = W/2 = v0x 0.
    const W = CONFIG.PX_TO_INTERNAL;
    const half = W >> 1;
    const rel = half + (amp ? Math.floor(releaseOffset * half / amp) : 0);
    this.v0x  = Physics.v0x(rel, W);                     // i[4] = v0x
    this.apex = Physics.apexT(this.v0y);
    // f214d.e (Sistema 5): velocità di swing al rilascio + ampiezza, usate dalle
    // soglie di centratura (rubber-band: più veloce dondola, più tolleranza).
    this.releaseVel = releaseOffset;
    this.releaseAmp = amp || 1;
    // d.i (0..10) = OFFSET DI RILASCIO discreto, indice del poligono BLOCK_POLY (SPEC §14.1).
    // ⚠ INCOERENZA NOTA, non risolta qui: nell'originale `d.i` è UNA SOLA variabile che
    // indicizza il poligono E genera v0x; qui v0x resta calcolato su W = PX_TO_INTERNAL
    // (vedi sopra) e questa è una grandezza SEPARATA usata SOLO per BLOCK_POLY. [DEDOTTO]
    // Quantizzazione lineare da [-amp,+amp] a [0, SLOTS-1], centro = 5 -> blocco piatto.
    this.releaseSlot = blockSlotForOffset(releaseOffset, amp);
    this.active = true;
    this._eval();
  }

  // DOUBLE-FLY — RILANCIO a mezz'aria (secondo stadio). Stesso `p()` dell'originale, ramo
  // `f251m[8] != 0` [LETTO javap j.p() offset 245-322]:
  //   i[2] = d.a ; i[1] = d.b   -> il volo riparte dalla POSIZIONE CORRENTE del blocco
  //                                (d.a/d.b sono riscritti a ogni frame dall'integratore,
  //                                [LETTO javap j(int) offset 262-293]), NON dal punto mani.
  //   i[3] = 0                  -> t riparte da zero
  //   i[0] = (v0y NOMINALE * 90)/100  (troncamento verso lo zero come l'int di Java)
  //   i[4] = ricalcolato da d.i e dalla larghezza del blocco, entrambi invariati in volo
  //          => v0x IDENTICA: qui la si lascia com'è.
  relaunch(v0yNominal) {
    // Posizione corrente = nuovo (x0,y0): va calcolata con la v0y ANCORA vecchia.
    this.x0 = Physics.x(this.t, this.v0x, this.x0);
    this.y0 = Physics.y(this.t, this.v0y, this.y0);
    this.t  = 0;
    this.v0y = Math.trunc(v0yNominal * CONFIG.DOUBLE_FLY_V0Y_PCT / 100);
    this.apex = Physics.apexT(this.v0y);            // i6 è ricalcolato ogni frame da i[0]
    this._eval();
  }

  // Velocità verticale CORRENTE del volo: i[0] + (10030*i[3])/1000 (divisione intera
  // troncata verso lo zero, come Java). [LETTO javap j.p() offset 27-46]
  get vyNow() {
    return this.v0y + Math.trunc(CONFIG.GRAVITY * this.t / 1000);
  }

  _eval() {
    let windShift = 0;
    if (this.game.envEvent && (this.game.envEvent.type === "wind" || this.game.envEvent.type === "blizzard" || this.game.envEvent.type === "fog")) {
      const flightProgress = Math.min(1.4, this.t / 600);
      windShift = this.game.envEvent.dir * this.game.envEvent.force * flightProgress;
    }
    this.xPx = Physics.toPx(Physics.x(this.t, this.v0x, this.x0)) + windShift;
    this.yWorld = Physics.toPx(Physics.y(this.t, this.v0y, this.y0));
    this.yPx = this.yWorld - this.game.cameraY;          // mondo -> schermo
  }

  // Sistema 5: il blocco è preso -> si ferma incastrato nel box dell'operaio.
  setCaught(quality, iAbs, center, edge, snapX, snapY) {
    this.caught = true; this.quality = quality; this.iAbs = iAbs;
    this.qCenter = center; this.qEdge = edge;
    this.xPx = snapX; this.yPx = snapY;
    this.yWorld = snapY + this.game.cameraY;
    this.settleElapsed = 0; this.settleY0 = this.yWorld;   // Sistema 10: base (mondo) dell'assestamento
  }

  // Sistema 10 — assestamento (LAND, SPEC §4): discesa cosmetica ease-seno di
  // SETTLE_DROP_PX su SETTLE_MS. Il modello a catena non ha uno slot separato dal
  // punto di presa: qui è solo feedback visivo (forma ease-out simile a m105c).
  updateSettle(dt) {
    if (!this.caught) return;
    this.settleElapsed = Math.min(this.settleElapsed + dt, CONFIG.SETTLE_MS);
    const u = this.settleElapsed / CONFIG.SETTLE_MS;
    const ease = Math.sin(u * Math.PI / 2);
    this.yWorld = this.settleY0 + ease * CONFIG.SETTLE_DROP_PX;
    this.yPx = this.yWorld - this.game.cameraY;
  }

  // Volo (j.m86j): t avanza di min(dt, FLY_SUBSTEP_MS) — clamp del sub-step 125ms
  // [SPEC §1 / riga 1212]. Posizione in forma chiusa (delta-time, FPS-independent).
  // Sistema 5: non si auto-atterra più; la presa è decisa fuori (Physics.checkCatch).
  // Se preso, il blocco resta fermo; altrimenti continua la parabola (anche in caduta).
  update(dt) {
    if (!this.active || this.caught) return;
    this.t += Math.min(dt, CONFIG.FLY_SUBSTEP_MS);   // clamp sub-step di volo
    this._eval();
  }

  // Render layer #3 (ARCH §2.2): blocco in volo/preso/in caduta (Sistema 15: pietra ombreggiata).
  render(ctx) {
    if (!this.active) return;
    if (CONFIG.THEME === 'custom') {
      const isPalma = (this.game.scenario === 'palma');
      const isBologna = (this.game.scenario === 'bologna');
      const bImg = isPalma ? Assets.custom.blocksPlanks[this.releaseSlot]
                 : isBologna ? Assets.custom.blocksBologna[this.releaseSlot]
                 : Assets.custom.blocksBrick[this.releaseSlot];
      if (bImg && bImg.complete && bImg.naturalWidth > 0) {
        ctx.drawImage(bImg, Math.round(this.xPx - 24), Math.round(this.yPx - 15));
        return;
      }
    }
    drawAnimFrame(ctx, SPRITES.block, this.releaseSlot, this.xPx, this.yPx, false);
  }
}

/* =========================================================================
   WorkerChain — la CATENA DI OPERAI della scalata (ARCH §2 "WorkerChain";
   SPEC §6.1). NON è una piramide: è la torre/impalcatura su cui gli operai si
   passano il blocco verso l'alto.
   - lunghezza = CONFIG.LEVELS[livello].workers  (f222b.length, dal file livello)
   - operaio i in COORDINATE MONDO a worldY = -i*TILE (impilamento, tile 23 px)
   - `current` = f232d: indice del LANCIATORE corrente; il ricevente è current+1
   - scalata finita quando current == count-1 (il RICEVITORE in cima) [SPEC 1732]
   - ruoli: ultimo = "ricevitore" (i38=0); i 5 più in alto = "cima" (i38+=7)
   ========================================================================= */
class WorkerChain {
  constructor(game) {
    this.game = game;
    this.workers = [];
    this.current = 0;
    this.levelId = CONFIG.QUICK_LEVEL_INDEX;
  }

  // Costruisce la catena per il livello (gemma 38-44, Quick 45): un Worker per operaio.
  build(levelId) {
    const lvl = CONFIG.LEVELS[levelId] || CONFIG.LEVELS[CONFIG.QUICK_LEVEL_INDEX];
    this.levelId = levelId;
    this.workers = [];
    const n = lvl.workers;
    const phaseRaw = CONFIG.WORKER_PHASES[levelId] || [];
    const clsList  = CONFIG.WORKER_CLASSES[levelId] || [];
    this._buildStepTable(n);                 // h(i) cumulato: serve a workerWorldY
    for (let i = 0; i < n; i++) {
      const role = (i === n - 1) ? "ricevitore"
                 : (i >= n - CONFIG.CHAIN_TOP_ROLE_COUNT) ? "cima" : "normale";
      // Fase iniziale dal dump: raw16 -> indice seno -> fase (indice*3200). [SPEC §2.1]
      const raw = (i < phaseRaw.length) ? phaseRaw[i] : 0;
      const phase0 = sinePhaseIndex(raw) * CONFIG.PHASE_TO_ANGLE_DIV;
      let cls = (i < clsList.length) ? clsList[i] : 0;   // classe visuale (3 = asino/Cacao)
      
      // Personalizzazione: in tutte le modalità, ogni operaio lungo la torre ha il 30% di probabilità di essere Cacao
      if (CONFIG.THEME === 'custom') {
        if (i === n - 1) {
          cls = CONFIG.CLASS_SLEDGE; // Anna col carrello in cima
        } else {
          cls = (Math.random() < 0.30) ? CONFIG.CLASS_DONKEY : 0;
        }
      }
      
      this.workers.push(new Worker(this.game, { index: i, worldY: this.workerWorldY(i), role, phase0, cls }));
    }
    this.current = 0;
  }

  get count() { return this.workers.length; }

  // Passo verticale dell'operaio i -> i+1. [LETTO j.class h(int)]
  //   h(i) = ( a[ b[i][0] ].length / j ) * 23
  stepY(i) {
    const sets = CONFIG.WORKER_SPRITE_SETS[this.levelId] || [];
    const camField = (this.levelId === CONFIG.QUICK_LEVEL_INDEX)
                   ? CONFIG.CAMERA_BASE_QUICK : CONFIG.CAMERA_BASE_EMPIRE;
    const set = (i >= 0 && i < sets.length) ? sets[i] : 0;
    const len = CONFIG.MODE_TILE_COUNT[set] || 0;
    const rawStep = ((len / camField) | 0) * CONFIG.TILE;
    // Limitando a 92px max (4 tile x 23px = lo standard dei normali), il lancio (apice 127px) raggiunge SEMPRE l'operaio sopra
    return Math.min(rawStep > 0 ? rawStep : 92, 92);
  }

  // Cumulate dei passi: y dell'operaio i = -somma di h(k) per k < i. [LETTO j.class q()
  //   offset 0-71: `int y = J*23; for (i..) { e[i].b = (e[i].c==2) ? y-h(i) : y-9; y -= h(i); }` ]
  _buildStepTable(n) {
    this.stepAccum = new Array(n + 1);
    this.stepAccum[0] = 0;
    for (let i = 0; i < n; i++) this.stepAccum[i + 1] = this.stepAccum[i] + this.stepY(i);
  }

  // Y MONDO del blocco appeso dell'operaio i. [LETTO j.class k(int)/h(int)]
  workerWorldY(i) {
    if (!this.stepAccum) return 0;
    const k = Math.max(0, Math.min(i, this.stepAccum.length - 1));
    return -this.stepAccum[k];
  }
  // Indice dell'operaio PIÙ IN ALTO attualmente VISIBILE (campo statico `y` di j.class).
  // [LETTO j.class `private static final void j()`]:
  //   x = MAX_VALUE; y = MIN_VALUE; i = m[20] (= d, ricopiato dalla camera in `b(int,int)`);
  //   i2 = h(i); i3 = e(i) - i2;                      // banda verticale dell'operaio i
  //   while (i < b.length) {
  //     if (a(0,i3,1,i2, 0,m[14],1,k)) { trovato=1; x=min(x,i); if (i>y) { y=i; z=i3; } }
  //     else if (trovato) return;                     // finita la finestra visibile: esce
  //     i++; i2 = h(i); i3 -= i2;
  //   }
  // `a(...)` è l'AABB a 8 argomenti (§14.5) usato qui su un solo asse; m[14] = scroll Y della
  // camera, k = h.a() = ALTEZZA DELLO SCHERMO. Quindi: visibile <=> e(i) > camY && e(i)-h(i) < camY+H.
  // Nel clone e(i) = workerWorldY(i) (bordo BASSO della banda) e h(i) = stepY(i).
  topVisibleIndex() {
    const H = this.game.ctx.canvas.height, camY = this.game.cameraY;
    let y = -Infinity, found = false;
    for (let i = this.current; i < this.count; i++) {   // m[20] insegue `current` [LETTO j.b(int,int) 52-67]
      const bottom = this.workerWorldY(i);              // e(i)
      const top    = bottom - this.stepY(i);            // e(i) - h(i)
      if (bottom > camY && top < camY + H) { found = true; y = i; }
      else if (found) break;
      // se non è ancora stato trovato nulla si continua a salire, come l'originale
    }
    return y;                                           // -Infinity = nessuno visibile (Integer.MIN_VALUE)
  }

  // Numero di RICEVENTI candidati del test di presa. [LETTO j.class `int j(int)` 333-379]
  //   i13 = min( max(3, y - d + 1), b.length - d );  if (c == 45) i13 = min(i13, 2);
  // `b.length - d` = operai residui sopra il lanciatore, incluso lui: garantisce che l'indice
  // massimo testato (d + i13 - 1) non superi MAI l'ultimo operaio.
  catchCandidateCount() {
    let n = Math.max(CONFIG.CATCH_CANDIDATES_MIN, this.topVisibleIndex() - this.current + 1);
    n = Math.min(n, this.count - this.current);
    if (this.levelId === CONFIG.QUICK_LEVEL_INDEX) n = Math.min(n, 2);
    return Math.max(1, n);
  }

  // Scalata completata: il blocco è arrivato al ricevitore in cima.
  get climbDone() { return this.current >= this.count - 1; }

  thrower() { return this.workers[this.current] || null; }
  catcher() { return this.workers[Math.min(this.current + 1, this.count - 1)] || null; }
  // Presa riuscita: la catena si porta all'indice del RICEVENTE EFFETTIVO. I candidati
  // sono d, d+1, d+2 (SPEC §14.5): se il blocco ricade sul lanciatore stesso (d) la catena
  // NON avanza; se lo prende due posizioni sopra, avanza di due. Clamp a count-1.
  advanceTo(idx) {
    this.current = Math.max(this.current, Math.min(idx, this.count - 1));
  }

  // Animazione degli operai: aggiorna animMs e swing di Cacao/Anna
  update(dt) {
    for (let i = 0; i < this.count; i++) {
      const w = this.workers[i];
      w.animMs += dt;
      if (w.cls === CONFIG.CLASS_DONKEY && i > this.current) {
        w.updateIdle(dt);
      }
    }
  }

  // Render layer #2 (ARCH §2.2): impalcatura + operai. Solo la finestra visibile: la
  // torre può essere lunga 101 operai (Quick), lo schermo ne mostra ~CAMERA_BASE tile.
  render(ctx, state) {
    const W = 240, H = 320, t = CONFIG.TILE, cx = 120;
    const isCustom = (CONFIG.THEME === 'custom');
    const isPalma = (this.game.scenario === 'palma');
    const isBologna = (this.game.scenario === 'bologna');

    if (isCustom) {
      // FULL-WIDTH SCAFFOLDING TOWER (Montagna, Palma o Bologna)
      const cPillar      = isPalma ? "#b89040" : isBologna ? "#8d4f24" : "#54321c";
      const cPillarLight = isPalma ? "#dcaf58" : isBologna ? "#b86a34" : "#7c4e28";
      const cPillarDark  = isPalma ? "#785820" : isBologna ? "#582810" : "#381e0e";
      const cBrace       = isPalma ? "rgba(120, 88, 32, 0.75)" : isBologna ? "rgba(140, 75, 35, 0.75)" : "rgba(70, 42, 22, 0.75)";
      const cRopeNode    = isPalma ? "#d4b870" : isBologna ? "#a89080" : "#9e9e9e";
      const cLadder      = isPalma ? "#785820" : isBologna ? "#582810" : "#5d4037";

      const pillars = [12, 72, 168, 228];

      // 1. Pilastri verticali distribuiti a tutta larghezza
      for (const px of pillars) {
        ctx.fillStyle = cPillar;
        ctx.fillRect(px, 0, 5, H);
        ctx.fillStyle = cPillarLight;
        ctx.fillRect(px, 0, 1, H);
        ctx.fillStyle = cPillarDark;
        ctx.fillRect(px + 4, 0, 1, H);

        if (isPalma) {
          ctx.fillStyle = "#503814";
          const offsetNy = (this.game.cameraY % 20 + 20) % 20;
          for (let ny = -offsetNy; ny < H + 20; ny += 20) {
            ctx.fillRect(px - 1, ny, 7, 2);
          }
        }
      }

      // 2. Travi diagonali a X nelle 3 campate
      const secH = 55;
      const offsetSec = (this.game.cameraY % secH + secH) % secH;
      const bays = [[pillars[0] + 5, pillars[1]], [pillars[1] + 5, pillars[2]], [pillars[2] + 5, pillars[3]]];
      ctx.strokeStyle = cBrace;
      ctx.lineWidth = 2;
      for (const [bx0, bx1] of bays) {
        for (let ySec = -offsetSec - secH; ySec < H + secH; ySec += secH) {
          ctx.beginPath();
          ctx.moveTo(bx0, ySec);
          ctx.lineTo(bx1, ySec + secH);
          ctx.moveTo(bx0, ySec + secH);
          ctx.lineTo(bx1, ySec);
          ctx.stroke();

          ctx.fillStyle = cRopeNode;
          const mx = (bx0 + bx1) >> 1, my = ySec + (secH >> 1);
          ctx.fillRect(mx - 2, my - 2, 4, 4);
        }
      }

      // 3. Scala a pioli nella campata destra
      const lx = 198;
      ctx.strokeStyle = cLadder;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(lx, 0); ctx.lineTo(lx, H);
      ctx.moveTo(lx + 6, 0); ctx.lineTo(lx + 6, H);
      const ladderStep = 10;
      const offsetLadder = (this.game.cameraY % ladderStep + ladderStep) % ladderStep;
      for (let ly = -offsetLadder; ly < H + ladderStep; ly += ladderStep) {
        ctx.moveTo(lx, ly); ctx.lineTo(lx + 6, ly);
      }
      ctx.stroke();

      // 4. Disegna le pedane a tutta larghezza e gli operai
      for (let i = 0; i < this.count; i++) {
        const w = this.workers[i];
        const sy = w.blockY;
        if (sy < -2 * t || sy > H + 2 * t) continue;

        // I piedi dell'operaio sono a oy + 1 (ovvero w.worldY - cameraY + 1)
        const py = (w.poseOriginWorldY() - this.game.cameraY) + 1;

        // Puntoni di supporto sotto ciascun pilastro
        ctx.fillStyle = isPalma ? "#845e20" : isBologna ? "#683416" : "#462812";
        for (const px of pillars) {
          ctx.beginPath();
          ctx.moveTo(px - 3, py + 10);
          ctx.lineTo(px, py + 5);
          ctx.lineTo(px - 5, py + 5);
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(px + 8, py + 10);
          ctx.lineTo(px + 5, py + 5);
          ctx.lineTo(px + 10, py + 5);
          ctx.fill();
        }

        // Piattaforma a TUTTA LARGHEZZA dello schermo (0..W)
        ctx.fillStyle = isPalma ? "#c89c48" : isBologna ? "#a45d2d" : "#6d4224";
        ctx.fillRect(0, py, W, 5);
        ctx.fillStyle = isPalma ? "#ebb860" : isBologna ? "#c87842" : "#945e34";
        ctx.fillRect(0, py, W, 1);
        ctx.fillStyle = isPalma ? "#684818" : isBologna ? "#5c2a10" : "#381e0e";
        ctx.fillRect(0, py + 4, W, 1);

        // Fessure assi ogni 20px
        ctx.fillStyle = isPalma ? "#684818" : isBologna ? "#5c2a10" : "#381e0e";
        for (let sx = 10; sx < W; sx += 20) {
          ctx.fillRect(sx, py, 1, 5);
        }

        if (isPalma) {
          // Legature di corda sui pilastri
          ctx.fillStyle = "#d4b870";
          for (const px of pillars) {
            ctx.fillRect(px, py - 1, 5, 6);
          }
        }

        if (i === this.current && state === S.SWING) {
          w.render(ctx);
        } else if (i === this.current + 1 && (state === S.SWING || state === S.FLY)) {
          w.renderCatcher(ctx);
        } else {
          w.renderSprite(ctx, i < this.current ? 2 : 0);
        }
      }

    } else {
      // Original fallback
      ctx.fillStyle = "#5d4037";
      ctx.fillRect(cx - 34, 0, 4, H);
      ctx.fillRect(cx + 30, 0, 4, H);
      for (let i = 0; i < this.count; i++) {
        const w = this.workers[i];
        const sy = w.blockY;
        if (sy < -2 * t || sy > H + 2 * t) continue;
        ctx.fillStyle = (w.role === "ricevitore") ? "#8d6e63" : "#6d4c41";
        ctx.fillRect(cx - 34, sy + t + 16, 68, 4);
        if (i === this.current && state === S.SWING) {
          w.render(ctx);
        } else if (i === this.current + 1 && (state === S.SWING || state === S.FLY)) {
          w.renderCatcher(ctx);
        } else {
          w.renderSprite(ctx, i < this.current ? 2 : 0);
        }
      }
    }
  }
}

/* =========================================================================
   Cart — il CARRELLO dell'handoff arcade->strategico (ARCH §2 "Cart",
   g.f119i, stato g.f83a=10). A scalata finita (w()) il blocco NON viene posato
   sulla catena: viaggia su un carrello verso la STANZA DI COMPOSIZIONE, dove
   il passo successivo lo piazzerà sulla griglia triangolare isometrica.
   Geometria/durata = DA STIMARE (non nei documenti).
   ========================================================================= */
/* =========================================================================
   MountainHouse — LAYER STRATEGICO SEMPLIFICATO (originale, NON fedele al gioco).
   Ogni scalata completata consegna UN PEZZO; i pezzi entrano in SEQUENZA FISSA
   (CONFIG.HOUSE_PIECES: fondamenta -> muri -> tetto -> camino). Non c'è griglia
   triangolare, non c'è adiacenza, non c'è cursore: il pezzo va sempre nella prossima
   casella libera della sequenza e non può essere rifiutato.
   La BARRA MAGICA della scalata decide la QUALITÀ del pezzo -> moltiplicatore di punti
   (CONFIG.HOUSE_QUALITY_*), mai la piazzabilità.
   Grafica: lo sprite BLOCCO già montato (SPRITES.block); `tilt` sceglie il frame di
   inclinazione, così le falde del tetto sono blocchi pendenti.
   ========================================================================= */
class MountainHouse {
  constructor(game) { this.game = game; this.reset(); }

  reset() {
    this.placed = [];     // { def, quality, value, points }
    this.anim = 0;        // ms della discesa del pezzo appena consegnato
    this.settled = true;  // nessun pezzo in discesa
  }

  get count()    { return this.placed.length; }
  get complete() { return this.placed.length >= CONFIG.HOUSE_PIECES.length; }
  get nextDef()  { return CONFIG.HOUSE_PIECES[this.placed.length] || null; }   // sequenza fissa
  get lastPiece(){ return this.placed[this.placed.length - 1] || null; }
  get stage()    { return this.nextDef ? this.nextDef.stage : "completata"; }
  get value()    { return this.placed.reduce((s, p) => s + p.value, 0); }
  get points()   { return this.placed.reduce((s, p) => s + p.points, 0); }

  // Aggiunge il pezzo in cima alla sequenza. `quality` = indice in HOUSE_QUALITY_*,
  // `value` = valore consegnato (barra magica >> 7). Ritorna il pezzo, null a casa piena.
  add(quality, value) {
    const def = this.nextDef;
    if (!def) return null;
    const mult = CONFIG.HOUSE_QUALITY_MULT[quality] || 1;
    const piece = { def, quality, value, points: (value * mult) >> CONFIG.HOUSE_POINTS_SHIFT };
    this.placed.push(piece);
    this.anim = 0;
    this.settled = false;
    return piece;
  }

  update(dt) {
    if (this.settled) return;
    this.anim += dt;
    if (this.anim >= CONFIG.HOUSE_PIECE_ANIM_MS) this.skipAnim();
  }
  skipAnim() { this.anim = CONFIG.HOUSE_PIECE_ANIM_MS; this.settled = true; }

  // Centro-base di una cella in coordinate schermo (l'origine dello sprite blocco è
  // ~ centro-basso: pivot [35,41] contro mod [21,2] del frame dritto).
  cellX(ctx, gx) { return Math.round(120 + gx * CONFIG.HOUSE_CELL_W); }
  cellY(ctx, gy) {
    return Math.round(320 * CONFIG.HOUSE_BASE_Y_FRAC - gy * CONFIG.HOUSE_CELL_H);
  }

  render(ctx, state) {
    const W = 240, H = 320;
    const ground = Math.round(H * CONFIG.HOUSE_BASE_Y_FRAC);
    const isCustom = (CONFIG.THEME === 'custom');
    const isPalma = (this.game.scenario === 'palma');
    const isBologna = (this.game.scenario === 'bologna');
    const cx = 120;

    if (isCustom) {
      // Sfondo cantiere sfumato
      ctx.fillStyle = "rgba(10, 15, 24, 0.40)";
      ctx.fillRect(0, 0, W, ground + 4);

      // Terreno del cantiere
      if (isPalma) {
        // Sabbia dorata della spiaggia
        ctx.fillStyle = "#e4c084";
        ctx.fillRect(0, ground + 4, W, H - ground - 4);
        ctx.fillStyle = "#f5daa8";
        ctx.fillRect(0, ground + 4, W, 2);
        ctx.fillStyle = "#cca569";
        ctx.fillRect(20, ground + 16, 50, 2);
        ctx.fillRect(140, ground + 22, 60, 2);
      } else if (isBologna) {
        // Pavimentazione in ciottoli e marciapiede dei portici
        ctx.fillStyle = "#5d4037";
        ctx.fillRect(0, ground + 4, W, H - ground - 4);
        ctx.fillStyle = "#8d6e63";
        ctx.fillRect(0, ground + 4, W, 2);
        ctx.fillStyle = "#a1887f";
        ctx.fillRect(15, ground + 12, 45, 2);
        ctx.fillRect(135, ground + 18, 55, 2);
      } else {
        // Prato alpino con fiori e ciottoli
        ctx.fillStyle = "#2a4420";
        ctx.fillRect(0, ground + 4, W, H - ground - 4);
        ctx.fillStyle = "#4b7337";
        ctx.fillRect(0, ground + 4, W, 2);
        ctx.fillStyle = "#ff80ab";
        ctx.fillRect(25, ground + 12, 3, 3);
        ctx.fillRect(185, ground + 16, 3, 3);
        ctx.fillStyle = "#ffd54a";
        ctx.fillRect(75, ground + 18, 3, 3);
      }

      // Sagome tratteggiate per i pezzi mancanti
      ctx.setLineDash([2, 3]);
      ctx.strokeStyle = isPalma ? "rgba(245, 196, 120, 0.40)" : isBologna ? "rgba(255, 160, 120, 0.40)" : "rgba(255, 128, 171, 0.40)";
      for (let i = this.placed.length; i < CONFIG.HOUSE_PIECES.length; i++) {
        const d = CONFIG.HOUSE_PIECES[i];
        const pImg = isPalma ? Assets.custom.housePalma[i]
                   : isBologna ? Assets.custom.houseBologna[i]
                   : Assets.custom.houseMontagna[i];
        const pw = (pImg && pImg.naturalWidth) ? pImg.naturalWidth : 52;
        const ph = (pImg && pImg.naturalHeight) ? pImg.naturalHeight : 32;
        ctx.strokeRect(Math.round(cx + d.dx - pw / 2), Math.round(ground + d.dy - ph), pw, ph);
      }
      ctx.setLineDash([]);

      // Pezzi posati in opera con animazione di discesa
      const cartX = W * CONFIG.CART_ROOM_X_FRAC;
      for (let i = 0; i < this.placed.length; i++) {
        const p = this.placed[i];
        const d = p.def;
        const pImg = isPalma ? Assets.custom.housePalma[i]
                   : isBologna ? Assets.custom.houseBologna[i]
                   : Assets.custom.houseMontagna[i];
        const pw = (pImg && pImg.naturalWidth) ? pImg.naturalWidth : 52;
        const ph = (pImg && pImg.naturalHeight) ? pImg.naturalHeight : 32;

        const xEnd = cx + d.dx, yEnd = ground + d.dy;
        let x = xEnd, y = yEnd;
        if (i === this.placed.length - 1 && !this.settled) {
          const u = this.anim / CONFIG.HOUSE_PIECE_ANIM_MS;
          x = Math.round(cartX + (xEnd - cartX) * u);
          y = Math.round(CONFIG.CART_Y + (yEnd - CONFIG.CART_Y) * (u * u));
        }

        if (pImg && pImg.complete && pImg.naturalWidth > 0) {
          ctx.drawImage(pImg, Math.round(x - pw / 2), Math.round(y - ph));
        } else {
          drawAnimFrame(ctx, SPRITES.block, d.tilt, x, y - (ph >> 1), false);
        }
      }

      // Fumo animato dal camino se pezzo 8 è completato (Montagna)
      if (this.placed.length >= 8 && !isPalma && !isBologna) {
        const fx = cx + 16;
        const fy = ground - 84 - 44;
        const smokeOffset = (Date.now() / 220) % 20;
        ctx.fillStyle = "rgba(235, 240, 245, 0.75)";
        ctx.beginPath(); ctx.arc(fx - 2, fy - 6 - smokeOffset * 0.5, 4 + smokeOffset * 0.2, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "rgba(215, 225, 235, 0.55)";
        ctx.beginPath(); ctx.arc(fx + 4, fy - 16 - smokeOffset * 0.7, 6 + smokeOffset * 0.3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "rgba(195, 210, 225, 0.35)";
        ctx.beginPath(); ctx.arc(fx + 10, fy - 26 - smokeOffset * 0.9, 8 + smokeOffset * 0.4, 0, Math.PI * 2); ctx.fill();
      }

      // Anna e Cacao festeggiano a bordo cantiere
      const fAnim = Math.floor(Date.now() / 150) % 4;
      const imCacao = Assets.custom.cacaoJump[fAnim] || Assets.custom.cacaoWait[0];
      if (imCacao && imCacao.complete && imCacao.naturalWidth > 0) {
        ctx.drawImage(imCacao, 14, ground - 34, 46, 34);
      }
      const imAnna = Assets.custom.annaCheer || Assets.custom.annaWait;
      if (imAnna && imAnna.complete && imAnna.naturalWidth > 0) {
        ctx.drawImage(imAnna, W - 44, ground - 41, 32, 42);
      }

      // Box Didascalia & Punteggio
      ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
      ctx.font = "10px 'Courier New', Courier, Menlo, Monaco, monospace";
      ctx.fillStyle = "#202530";
      ctx.fillRect(8, H - 38, W - 16, 32);
      ctx.strokeStyle = isPalma ? "#ffd54a" : isBologna ? "#ffb74d" : "#ff80ab";
      ctx.lineWidth = 1;
      ctx.strokeRect(8, H - 38, W - 16, 32);

      const title = isPalma ? "CHIRINGUITO A PALMA 🏖️" : isBologna ? "PALAZZINA A BOLOGNA 🏛️" : "CHALET ALPINO DI ANNINA 🏔️";
      ctx.fillStyle = isPalma ? "#ffe082" : isBologna ? "#ffcc80" : "#ff80ab";
      ctx.font = "bold 10px 'Courier New', Courier, Menlo, Monaco, monospace";
      ctx.fillText(title + " (" + this.placed.length + "/" + CONFIG.HOUSE_PIECES.length + ")", W / 2, H - 24);

      const p = this.lastPiece;
      if (state === S.PLACEMENT && p) {
        ctx.fillStyle = CONFIG.HOUSE_QUALITY_COLORS[p.quality] || "#fff";
        ctx.font = "10px 'Courier New', Courier, Menlo, Monaco, monospace";
        ctx.fillText(p.def.label + " " + CONFIG.HOUSE_QUALITY_NAMES[p.quality] +
                     " x" + CONFIG.HOUSE_QUALITY_MULT[p.quality] +
                     " = +" + p.points + " pt", W / 2, H - 11);
      } else if (state === S.CART && this.nextDef) {
        ctx.fillStyle = "#80deea";
        ctx.font = "10px 'Courier New', Courier, Menlo, Monaco, monospace";
        ctx.fillText("In arrivo: " + this.nextDef.label, W / 2, H - 11);
      } else {
        ctx.fillStyle = "#a5d6a7";
        ctx.font = "10px 'Courier New', Courier, Menlo, Monaco, monospace";
        ctx.fillText("Completata! Punti Totali: +" + this.points, W / 2, H - 11);
      }

    } else {
      // Fallback
      ctx.fillStyle = "#28301f";
      ctx.fillRect(0, ground + 4, W, H - ground - 4);
      ctx.strokeStyle = "#6b8a5c"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, ground + 5); ctx.lineTo(W, ground + 5); ctx.stroke();

      ctx.setLineDash([2, 3]);
      ctx.strokeStyle = "rgba(255,255,255,0.18)";
      for (let i = this.placed.length; i < CONFIG.HOUSE_PIECES.length; i++) {
        const d = CONFIG.HOUSE_PIECES[i];
        ctx.strokeRect(this.cellX(ctx, d.gx || 0) - 14, this.cellY(ctx, d.gy || 0) - 39, 29, 43);
      }
      ctx.setLineDash([]);

      const cartX = W * CONFIG.CART_ROOM_X_FRAC;
      for (let i = 0; i < this.placed.length; i++) {
        const p = this.placed[i];
        const xEnd = this.cellX(ctx, p.def.gx || 0), yEnd = this.cellY(ctx, p.def.gy || 0);
        let x = xEnd, y = yEnd;
        if (i === this.placed.length - 1 && !this.settled) {
          const u = this.anim / CONFIG.HOUSE_PIECE_ANIM_MS;
          x = Math.round(cartX + (xEnd - cartX) * u);
          y = Math.round(CONFIG.CART_Y + (yEnd - CONFIG.CART_Y) * (u * u));
        }
        drawAnimFrame(ctx, SPRITES.block, p.def.tilt, x, y, false);
      }

      ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
      ctx.font = "10px 'Courier New', Courier, Menlo, Monaco, monospace";
      ctx.fillStyle = "#cfd8dc";
      ctx.fillText("casa " + this.placed.length + "/" + CONFIG.HOUSE_PIECES.length +
                   "   fase: " + this.stage, W / 2, ground + 17);
      const p = this.lastPiece;
      if (state === S.PLACEMENT && p) {
        ctx.fillStyle = CONFIG.HOUSE_QUALITY_COLORS[p.quality] || "#fff";
        ctx.font = "bold 10px 'Courier New', Courier, Menlo, Monaco, monospace";
        ctx.fillText(p.def.label + " " + CONFIG.HOUSE_QUALITY_NAMES[p.quality] +
                     " x" + CONFIG.HOUSE_QUALITY_MULT[p.quality] +
                     " = +" + p.points, W / 2, ground + 30);
      } else if (state === S.CART && this.nextDef) {
        ctx.fillStyle = "#9cf";
        ctx.fillText("in arrivo: " + this.nextDef.label, W / 2, ground + 30);
      }
      ctx.lineWidth = 1;
    }
  }
}

class Cart {
  constructor(game) {
    this.game = game;
    this.elapsed = 0;
    this.arrived = false;
  }
  start() { this.elapsed = 0; this.arrived = false; }
  update(dt) {
    if (this.arrived) return;
    this.elapsed += dt;
    if (this.elapsed >= CONFIG.CART_TRAVEL_MS) { this.elapsed = CONFIG.CART_TRAVEL_MS; this.arrived = true; }
  }
  get progress() { return Math.min(1, this.elapsed / CONFIG.CART_TRAVEL_MS); }

  render(ctx, state) {
    const W = 240, t = CONFIG.TILE;
    const x0 = -60, x1 = W * CONFIG.CART_ROOM_X_FRAC, y = CONFIG.CART_Y;
    const isCustom = (CONFIG.THEME === 'custom');
    const isPalma = (this.game.scenario === 'palma');

    if (isCustom) {
      // Passerella in legno / pontile
      const cTrack = isPalma ? "#b89040" : "#6d4224";
      const cTrackLight = isPalma ? "#ebb860" : "#945e34";
      ctx.fillStyle = cTrack;
      ctx.fillRect(0, y + 6, W, 5);
      ctx.fillStyle = cTrackLight;
      ctx.fillRect(0, y + 6, W, 1);

      const x = (state === S.PLACEMENT) ? x1 : x0 + (x1 - x0) * this.progress;
      const f = Math.floor(this.elapsed / 130) % 4;
      const im = Assets.custom.annaCart[f];

      if (im && im.complete && im.naturalWidth > 0) {
        // Disegna Anna che corre trainando il carrello
        const dw = 85, dh = 54;
        ctx.drawImage(im, Math.round(x - 30), Math.round(y - dh + 8), dw, dh);
      } else {
        ctx.fillStyle = "#795548";
        ctx.fillRect(x - 20, y + 2, 40, 6);
      }

      // Blocco sul carrello durante il viaggio
      if (state === S.CART) {
        const isBologna = (this.game.scenario === 'bologna');
        const bImg = isPalma ? Assets.custom.blocksPlanks[5]
                   : isBologna ? Assets.custom.blocksBologna[5]
                   : Assets.custom.blocksBrick[5];
        if (bImg && bImg.complete && bImg.naturalWidth > 0) {
          ctx.drawImage(bImg, Math.round(x - 42), Math.round(y - 20));
        } else {
          drawAnimFrame(ctx, SPRITES.block, 5, x - 20, y, false);
        }
      }
    } else {
      ctx.strokeStyle = "#6d4c41"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, y + 8); ctx.lineTo(W, y + 8); ctx.stroke();
      const x = (state === S.PLACEMENT) ? x1 : x0 + (x1 - x0) * this.progress;
      ctx.fillStyle = "#795548";
      ctx.fillRect(x - (t >> 1) - 4, y + 2, t + 8, 6);
      if (state === S.CART) drawAnimFrame(ctx, SPRITES.block, CONFIG.RELEASE_OFFSET_SLOTS >> 1, x, y, false);
      ctx.lineWidth = 1;
    }
  }
}

/* =========================================================================
   ParticleSystem — effetti transitori (ARCH "ParticleSystem", f235f + popup +
   fx combo). Polvere d'impatto alla presa, numero di punteggio fluttuante,
   scintilla combo. Nessuna logica di gioco: solo feedback visivo (Sistema 13).
   Ordine update: dopo Pyramid/StoneBlock (ARCH §2.1 f). Render: layer #5,
   sopra piramide/blocco/operai, sotto la HUD (ARCH §2.2).
   ========================================================================= */
class ParticleSystem {
  constructor(game) {
    this.game = game;
    this.list = [];
    this._weatherAcc = 0;
  }

  // Polvere d'impatto: alla presa (deposito), qualche scheggia che schizza via.
  spawnImpact(x, y) {
    for (let i = 0; i < 6; i++) {
      const a = (Math.PI * 2 * i) / 6 + Math.random() * 0.5;
      this.list.push({
        kind: "dust", x, y, age: 0, life: 380,
        vx: Math.cos(a) * (20 + Math.random() * 30),
        vy: Math.sin(a) * (20 + Math.random() * 30) - 20,
      });
    }
  }

  // Numero di punteggio fluttuante verso l'alto (SPEC §7: punteggio per presa).
  spawnScorePopup(x, y, text, color) {
    this.list.push({ kind: "text", x, y, age: 0, life: 800, vy: -28, text, color });
  }

  // Scintilla combo: presa PERFETTA che allunga la catena di combo.
  spawnCombo(x, y) {
    for (let i = 0; i < 8; i++) {
      const a = (Math.PI * 2 * i) / 8;
      this.list.push({
        kind: "spark", x, y, age: 0, life: 500,
        vx: Math.cos(a) * 40, vy: Math.sin(a) * 40,
      });
    }
  }

  _spawnEnvParticle(env, W, H) {
    if (env.type === "earthquake") {
      this.list.push({
        kind: "quake_debris",
        x: Math.random() * W,
        y: -5,
        age: 0,
        life: 900 + Math.random() * 400,
        vx: (Math.random() - 0.5) * 35,
        vy: 90 + Math.random() * 80,
        s: 2 + Math.random() * 2,
        color: Math.random() < 0.5 ? "#bcaaa4" : "#8d6e63",
      });
    } else if (env.type === "wind") {
      this.list.push({
        kind: "wind_breeze",
        x: (env.dir > 0) ? -10 : W + 10,
        y: Math.random() * H,
        age: 0,
        life: 800 + Math.random() * 300,
        vx: env.dir * (160 + Math.random() * 90),
        vy: (Math.random() - 0.5) * 30,
        len: 14 + Math.random() * 16,
        color: Math.random() < 0.4 ? "rgba(255, 235, 170, 0.7)" : "rgba(255, 255, 255, 0.45)",
      });
    } else if (env.type === "blizzard") {
      this.list.push({
        kind: "snow",
        x: (env.dir > 0) ? (Math.random() * W - 40) : (Math.random() * W + 40),
        y: Math.random() * (H + 40) - 20,
        age: 0,
        life: 900 + Math.random() * 400,
        vx: env.dir * (170 + Math.random() * 100),
        vy: 55 + Math.random() * 50,
        s: 1.2 + Math.random() * 2.2,
      });
    } else if (env.type === "fog") {
      this.list.push({
        kind: "mist",
        x: (env.dir > 0) ? -20 : W + 20,
        y: Math.random() * H,
        age: 0,
        life: 1200 + Math.random() * 500,
        vx: env.dir * (110 + Math.random() * 70),
        vy: (Math.random() - 0.5) * 20,
        s: 14 + Math.random() * 18,
        color: "rgba(220, 230, 240, 0.35)",
      });
    }
  }

  update(dt, envEvent, W = 240, H = 320) {
    if (envEvent) {
      this._weatherAcc += dt;
      const rate = (envEvent.type === "blizzard") ? 22 : (envEvent.type === "fog") ? 26 : (envEvent.type === "wind") ? 32 : 55;
      while (this._weatherAcc >= rate) {
        this._weatherAcc -= rate;
        this._spawnEnvParticle(envEvent, W, H);
      }
    }

    if (this.list.length === 0) return;
    const dtS = dt / 1000;
    for (const p of this.list) {
      p.age += dt;
      p.x += p.vx * dtS;
      p.y += p.vy * dtS;
      if (p.kind === "dust") p.vy += 140 * dtS;
      if (p.kind === "quake_debris") p.vy += 80 * dtS;
    }
    this.list = this.list.filter((p) => p.age < p.life);
  }

  render(ctx) {
    for (const p of this.list) {
      const u = p.age / p.life;
      const alpha = 1 - u;
      ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
      if (p.kind === "dust") {
        ctx.fillStyle = "#d7ccc8";
        const s = 3 * (1 - u * 0.6);
        ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
      } else if (p.kind === "spark") {
        ctx.fillStyle = "#fff59d";
        ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
      } else if (p.kind === "text") {
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.font = "bold 11px monospace";
        ctx.fillStyle = p.color || "#ffd54a";
        ctx.fillText(p.text, p.x, p.y);
      } else if (p.kind === "quake_debris") {
        ctx.fillStyle = p.color || "#bcaaa4";
        ctx.fillRect(p.x, p.y, p.s, p.s);
      } else if (p.kind === "wind_breeze") {
        ctx.strokeStyle = p.color || "rgba(255, 235, 170, 0.7)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x + (p.vx > 0 ? p.len : -p.len), p.y + p.vy * 0.04);
        ctx.stroke();
      } else if (p.kind === "snow") {
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2);
        ctx.fill();
      } else if (p.kind === "mist") {
        ctx.fillStyle = p.color || "rgba(220, 230, 240, 0.35)";
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }
}

/* =========================================================================
   AudioManager — SFX + vibrazione (ARCH "AudioManager", h + h.c). Event-driven
   (non fa polling, ARCH §2.1 #3). Sistema 14: le tracce MIDI originali
   (assets/audio/*.mid) NON sono decodificate qui (fuori scopo, serve un
   sequencer MIDI); al loro posto toni sintetizzati via WebAudio come
   feedback APPROSSIMATIVO (non "dal codice", solo UX equivalente).
   ========================================================================= */
class AudioManager {
  constructor() {
    this.ctx = null;
    this.muted = localStorage.getItem("pb_muted") === "1";
    this.currentMood = localStorage.getItem("pb_annina_mood") || "baddie";
    this.bgm = new Audio();
    this.bgm.loop = true;
    this.bgm.volume = 0.65;
    this._initBGM();
  }

  _initBGM() {
    this.setMood(this.currentMood, false);
  }

  setMood(mood, autoPlay = true) {
    this.currentMood = mood;
    localStorage.setItem("pb_annina_mood", mood);
    this.bgm.pause();
    this.bgm.src = `assets/audio/${mood}.mp3`;
    this.bgm.loop = true;
    this.bgm.currentTime = 0;
    this.bgm.load();
    if (!this.muted && autoPlay) {
      const p = this.bgm.play();
      if (p && typeof p.catch === 'function') p.catch(() => {});
    }
  }

  ensureBGM() {
    if (!this.muted && this.bgm.paused) {
      const p = this.bgm.play();
      if (p && typeof p.catch === 'function') p.catch(() => {});
    }
  }

  _ensureCtx() {
    if (this.ctx) return this.ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    this.ctx = new AC();
    return this.ctx;
  }

  setMuted(m) {
    this.muted = m;
    localStorage.setItem("pb_muted", m ? "1" : "0");
    if (m) {
      this.bgm.pause();
    } else {
      const p = this.bgm.play();
      if (p && typeof p.catch === 'function') p.catch(() => {});
    }
  }

  // Tono base: oscillatore + inviluppo esponenziale di decadimento.
  tone(freq, durMs = 120, type = "square", gain = 0.15) {
    if (this.muted) return;
    const ctx = this._ensureCtx();
    if (!ctx) return;
    if (ctx.state === "suspended") ctx.resume();
    const osc = ctx.createOscillator();
    const amp = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    amp.gain.value = gain;
    osc.connect(amp).connect(ctx.destination);
    const t0 = ctx.currentTime;
    osc.start(t0);
    amp.gain.exponentialRampToValueAtTime(0.0001, t0 + durMs / 1000);
    osc.stop(t0 + durMs / 1000 + 0.02);
  }

  // Sequenza di toni (arpeggio) per eventi "celebrativi" (livello/medaglia).
  arpeggio(freqs, stepMs = 90, type = "square", gain = 0.16) {
    freqs.forEach((f, i) => setTimeout(() => this.tone(f, stepMs + 30, type, gain), i * stepMs));
  }

  launch()       { this.tone(220, 60, "square", 0.10); }
  catchQuality(q) {
    if (q === CONFIG.QUALITY_PERFECT) this.tone(880, 140, "sine", 0.18);
    else if (q === CONFIG.QUALITY_MID) this.tone(660, 110, "triangle", 0.15);
    else if (q === CONFIG.QUALITY_EDGE) this.tone(392, 110, "sawtooth", 0.15);
  }
  miss()          { this.tone(110, 320, "sawtooth", 0.20); }
  subLevelClear() { this.arpeggio([523, 659, 784], 90, "square", 0.14); }
  // Pezzo aggiunto alla casa: tonfo di posa, tanto più alto quanto migliore la qualità.
  housePiece(q)   { this.tone(160 + q * 60, 200, "triangle", 0.18); }
  rank(rank)      { this.arpeggio([392, 523, 659, 784, 988, 1175].slice(0, Math.max(2, rank + 2)), 80, "sine", 0.16); }
  gameOver()      { this.arpeggio([392, 330, 262], 160, "sawtooth", 0.18); }
}

/* =========================================================================
   Game — root / loop con gate 25ms e clamp 200ms (ARCH §0, SPEC §1).
   Sistema 1: nessun sottosistema di gameplay, solo macchina a stati.
   ========================================================================= */
class Game {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");

    // Dati globali (placeholder per lo scheletro).
    this.mode = MODE.NONE;
    this.loadProgress = 0;
    this.misses = 0;
    // --- LAYER STRATEGICO SEMPLIFICATO: la CASA DI MONTAGNA (vedi MountainHouse) ---
