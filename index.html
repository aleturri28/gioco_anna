    // Sostituisce piramidi/griglia/lati splendenti dell'originale. Un pezzo per scalata,
    // sequenza fissa, casa completa -> RESULTS.
    this.house = new MountainHouse(this);
    // Qualità e valore del pezzo, congelati dall'handoff di fine scalata.
    this.deliveredQuality = 0;
    this.deliveredValue = 0;

    // --- DOUBLE-FLY (SPEC §4.1/§14.4) ---
    // `doubleFlyCharges` = f251m[9]: cariche di rilancio, cap 99. NON si azzerano tra una
    // scalata e l'altra (all'handoff l'originale fa `g.d = m[9]` [LETTO javap j.w() offset
    // 69-75] e la fase 10 del loader rilegge `m[9] = g.d` — ma SOLO fuori dal livello 45
    // [LETTO javap j.a() offset 140-156]). Qui il valore vive in Game per tutta la run.
    this.doubleFlyCharges = CONFIG.DOUBLE_FLY_CHARGES_INIT;
    // `flightLaunches` = f251m[8]: lanci del volo CORRENTE. 0 fuori dal volo; 1 dopo il
    // lancio normale; 2 dopo un rilancio. Azzerato a presa avvenuta [LETTO javap j(int)
    // offset 1311-1317] e su miss (`y()`).
    this.flightLaunches = 0;

    // Sistema 9: punteggio + combo (SPEC §7). `scoreInternal` = n (accumulatore interno,
    // scala <<7); mostrato = n>>7. `combo`/`comboMax` = C/D; `comboTimer` = B (ms residui
    // finestra combo, si azzera quando scade). Persistono per l'intera run (Quick/Empire),
    // azzerati in startQuick()/startEmpire(), NON a ogni scalata.
    this.scoreInternal = 0;
    this.combo = 0;
    this.comboMax = 0;
    this.comboTimer = 0;
    this.climbScore = 0;   // `n` della scalata corrente -> barra magica (m83c/w())
    this.climbElapsed = 0; // f251m[24]: CRONOMETRO della scalata in ms. Avanza ogni frame
                           // finché la scalata non è completata. [LETTO j.class a(int)]

    this.stats = this.loadStats();
    this.highScore = this.stats.quick.highScore;
    this.quickFloors = 0;
    this.quickSwingSpeed = CONFIG.SWING_SPEED_INIT;
    this.envEvent = null;
    this.banner = null;
    this.scheduledEvent = null;
    this.eventTriggeredThisClimb = false;
    this.quickCooldown = 0;
    this.empireStartTime = 0;
    this.empirePerfectCount = 0;

    // Timing del loop.
    this.lastUpdate = 0;   // ultimo istante in cui la logica ha aggiornato
    this.lastDt = 0;       // ultimo dt applicato (per HUD)
    this.fps = 0;
    this._fpsAcc = 0;
    this._fpsFrames = 0;

    // Input (ARCH §2): creato PRIMA della StateMachine, che lo legge ogni frame.
    this.input = new InputManager(canvas);
    this.scenario = localStorage.getItem("pb_scenario") || "montagna";
    this.audioMenuIndex = 0;
    this.menuItems = [
      "Scalata Rapida (Quick)",
      "Costruisci la Casetta (Empire)",
      "Scenario: " + (this.scenario === "palma" ? "Palma 🏖️" : this.scenario === "bologna" ? "Bologna 🏛️" : "Montagna 🏔️"),
      "Record & Statistiche 🏆",
      "Musica & Mood di Annina 🎧",
      "Dedica per Annina ❤️"
    ];
    this.menuIndex = 0;

    // Sistema 4: blocco attivo (volo a proiettile in FLY).
    this.stone = new StoneBlock(this);
    // Sistema 7 (RIFATTO): CATENA di operai in coordinate mondo. La lunghezza viene dai
    // dati livello (LEVELS[...].workers), non da un cap di schermo. startClimb() la
    // costruisce quando si sceglie modalità/gemma.
    this.chain = new WorkerChain(this);
    this.levelId = CONFIG.QUICK_LEVEL_INDEX;   // livello/gemma della scalata corrente (j.f204c)
    this.gemIndex = 0;                         // indice in EMPIRE_GEM_LEVELS della scalata corrente
    this.rank = -1;                            // rank finale (indice RANK_THRESHOLDS)
    this.chain.build(this.levelId);
    // Alias del lanciatore e del ricevente correnti (riassegnati a ogni SWING). Tutti i
    // sistemi 3-6 continuano a usare g.worker / g.catcher senza modifiche.
    this.worker  = this.chain.thrower();
    this.catcher = this.chain.catcher();
    // SPEC §14.5: il ricevente EFFETTIVO (d, d+1 o d+2) si scopre solo al momento della
    // presa; `catcher` qui è solo il candidato di default (d+1). `catchIndex` è l'indice
    // a cui la catena si porta in LAND.
    this.catchIndex = this.chain.current + 1;
    this.catchSide = -1;   // vestigiale: alterna il lato "atteso" della presa (non riposiziona
                           // più il ricevente, che ora sta sulla sua fase seminata).
    // Ultima qualità di presa ottenuta (QUALITY_*), mostrata a schermo.
    this.lastQuality = -1;
    // Tipo blocco (0..4): in Empire viene dalla gemma scelta, in Quick è casuale (m101a).
    // Serve SOLO a grafica/colore (carrello + piramide): NON entra nella v0y del lancio,
    // che dipende dalla classe del lanciatore `e[d].c` [LETTO j.p() 108-159].
    this.blockType = 0;

    // Sistema 8 (RIFATTO): camera = OFFSET MONDO. schermo = mondo - cameraY; il pan
    // Catmull-Rom la porta a inseguire l'operaio corrente mentre il blocco sale.
    this.cameraY = 0;
    this._panFrom = 0; this._panTo = 0; this._panElapsed = 0; this._panDur = 0; this._panning = false;
    // CART: consegna del blocco alla stanza di composizione (handoff w(), g.f83a=10).
    this.cart = new Cart(this);

    // Sistema 13: effetti transitori (polvere, popup punteggio, scintille combo).
    this.particles = new ParticleSystem(this);
    // Sistema 14: SFX + vibrazione (event-driven, ARCH "AudioManager").
    this.audio = new AudioManager();

    this.sm = new StateMachine(this);
  }

  // Avvio modalità (ARCH §1.2-1.3).
  // QUICK: endless dentro la piramide, livello 45 (101 operai), blocco casuale, nessuna
  // costruzione. Il primo miss è fatale (QUICK_MISS_IS_FATAL). [SPEC §10]
  startQuick() {
    this.misses = 0;
    this.quickFloors = 0;
    this.quickSwingSpeed = CONFIG.SWING_SPEED_INIT;
    this.resetRunScore();
    this.startClimb(CONFIG.QUICK_LEVEL_INDEX);
  }
  // EMPIRE: una scalata per ogni pezzo della casa. A fine scalata l'handoff manda il pezzo
  // al carrello e da lì al cantiere; casa completata -> RESULTS.
  startEmpire() {
    this.misses = 0;
    this.resetRunScore();
    this.rank = -1;
    this.house.reset();                   // cantiere vuoto: si riparte dalle fondamenta
    this.deliveredQuality = 0;
    this.deliveredValue = 0;
    this.empireStartTime = Date.now();
    this.empirePerfectCount = 0;
    this.gemIndex = this.nextEmpireGem();
    this.startClimb(CONFIG.EMPIRE_GEM_LEVELS[this.gemIndex]);
  }

  // GEMMA della prossima scalata. Nell'originale la sceglieva il giocatore da una barra
  // vincolata alla piramide in corso (topazio/onice solo sulla terza). Nel layer
  // semplificato non c'è né barra né scelta: la gemma avanza col PEZZO da costruire, così
  // la casa sale insieme alla difficoltà (catene 13 -> 37 operai) e l'ultimo pezzo, il
  // camino, si paga con la scalata più lunga.
  nextEmpireGem() {
    return Math.min(this.house.count, CONFIG.EMPIRE_GEM_LEVELS.length - 1);
  }

  // CONSEGNA del pezzo al cantiere: lo aggiunge alla casa nella prossima casella della
  // sequenza fissa e accredita i punti (valore x moltiplicatore di qualità). La qualità
  // non decide se il pezzo entra — entra sempre.
  deliverPieceToHouse() {
    const piece = this.house.add(this.deliveredQuality, this.deliveredValue);
    if (!piece) return null;
    // Il punteggio mostrato è `scoreInternal >> 7`: per accreditare `points` punti visibili
    // si somma alla scala interna. Stessa strada del punteggio di presa (Sistema 9).
    this.scoreInternal += piece.points << CONFIG.SCORE_DISPLAY_SHIFT;
    this.audio.housePiece(piece.quality);
    return piece;
  }

  // Prepara una SCALATA: costruisce la catena dai dati livello, azzera la barra magica,
  // riporta la camera sul primo operaio. Non tocca il punteggio di run.
  startClimb(levelId) {
    this.levelId = levelId;
    this.misses = 0; // Azzera i tentativi falliti ad ogni nuovo blocco/scalata
    this.chain.build(levelId);
    this.worker  = this.chain.thrower();
    this.catcher = this.chain.catcher();
    this.catchIndex = this.chain.current + 1;   // ricevente di default finché non c'è una presa
    this.catchSide = -1;   // (vestigiale, vedi costruttore)
    this.climbScore = 0;                       // `n` della scalata -> barra magica (m83c)
    this.climbElapsed = 0;                     // f251m[24]: riparte il cronometro
    this.stone.active = false;
    // Quick: blocco CASUALE (m101a); Empire: tipo determinato dalla gemma scelta (g.l).
    this.blockType = (this.mode === MODE.QUICK)
      ? Math.floor(Math.random() * 5)
      : (CONFIG.EMPIRE_GEM_LEVELS.indexOf(levelId) + 5) % 5;
    this.cart.start();
    this.resetCamera();
    this.setupEnvironmentalDifficulty();
  }

  setupEnvironmentalDifficulty() {
    this.envEvent = null;
    this.banner = null;
    this.scheduledEvent = null;
    this.eventTriggeredThisClimb = false;

    if (this.mode === MODE.EMPIRE) {
      // Nella modalità Empire: dal 4° blocco in poi (dopo aver piazzato 3 pezzi)
      // Probabilità del 50% di avere un evento speciale casuale durante la scalata
      if (this.house && this.house.placed.length >= 3 && Math.random() < 0.50) {
        // Durata tra 5s (5000ms) e 15s (15000ms)
        const durationMs = 5000 + Math.random() * 10000;
        // Compare casualmente durante la scalata (tra 1.0s e 4.5s dall'avvio)
        const startDelayMs = 1000 + Math.random() * 3500;

        const pickQuake = Math.random() < 0.5;
        let eventData = null;
        if (pickQuake) {
          eventData = {
            type: "earthquake",
            name: "Terremoto",
            force: 2.5,
          };
        } else {
          const dir = Math.random() < 0.5 ? -1 : 1;
          const isPalma = (this.scenario === "palma");
          const isBologna = (this.scenario === "bologna");
          if (isPalma) {
            eventData = {
              type: "wind",
              name: "Vento",
              dir: dir,
              force: 20,
            };
          } else if (isBologna) {
            eventData = {
              type: "fog",
              name: "Nebbione Bolognese",
              dir: dir,
              force: 20,
            };
          } else {
            eventData = {
              type: "blizzard",
              name: "Bufera di Neve",
              dir: dir,
              force: 20,
            };
          }
        }
        this.scheduledEvent = {
          delay: startDelayMs,
          duration: durationMs,
          eventData: eventData,
        };
      }
    } else if (this.mode === MODE.QUICK) {
      if (this.quickFloors >= 3 && (!this.quickCooldown || this.quickCooldown <= 0)) {
        this.checkScheduleQuickEvent();
      }
    }
  }

  checkScheduleQuickEvent() {
    if (this.envEvent || this.scheduledEvent) return;
    // 50% di probabilità di attivazione
    if (Math.random() < 0.50) {
      const durationMs = 5000 + Math.random() * 10000;
      const startDelayMs = 1200 + Math.random() * 3500;
      const r = Math.random();
      let eventData = null;
      if (r < 0.50) {
        eventData = {
          type: "earthquake",
          name: "Terremoto",
          force: 2.2 + Math.min(1.5, this.quickFloors * 0.05),
        };
      } else {
        const dir = Math.random() < 0.5 ? -1 : 1;
        const isPalma = (this.scenario === "palma");
        const isBologna = (this.scenario === "bologna");
        const force = 18 + Math.min(8, this.quickFloors * 0.15);
        if (isPalma) {
          eventData = {
            type: "wind",
            name: "Vento",
            dir: dir,
            force: force,
          };
        } else if (isBologna) {
          eventData = {
            type: "fog",
            name: "Nebbione Bolognese",
            dir: dir,
            force: force,
          };
        } else {
          eventData = {
            type: "blizzard",
            name: "Bufera di Neve",
            dir: dir,
            force: force,
          };
        }
      }
      this.scheduledEvent = {
        delay: startDelayMs,
        duration: durationMs,
        eventData: eventData,
      };
    } else {
      this.quickCooldown = 6000 + Math.random() * 6000;
    }
  }

  tickEnvironmentalEvents(dt) {
    if (this.quickCooldown > 0) {
      this.quickCooldown = Math.max(0, this.quickCooldown - dt);
    }

    // Se c'è un evento programmato in attesa di cominciare
    if (this.scheduledEvent && !this.envEvent && !this.eventTriggeredThisClimb) {
      this.scheduledEvent.delay -= dt;
      if (this.scheduledEvent.delay <= 0) {
        // L'evento inizia a sorpresa durante il livello!
        this.envEvent = Object.assign({}, this.scheduledEvent.eventData);
        this.envEvent.duration = this.scheduledEvent.duration;
        this.envEvent.remaining = this.scheduledEvent.duration;
        this.eventTriggeredThisClimb = true;
        this.scheduledEvent = null;

        const durSec = Math.round(this.envEvent.duration / 1000);
        if (this.envEvent.type === "earthquake") {
          this.banner = {
            title: "⚠️ ALLERTA TERREMOTO! 🌋",
            subtitle: `Scosse sismiche improvvise! (${durSec}s)`,
            color: "#ff5252",
            timer: 2400,
          };
        } else if (this.envEvent.type === "wind") {
          const dirText = this.envEvent.dir > 0 ? "➡️ (verso DX)" : "⬅️ (verso SX)";
          this.banner = {
            title: "💨 VENTO FORTE " + (this.envEvent.dir > 0 ? "➡️" : "⬅️"),
            subtitle: `Raffiche improvvise ${dirText}! (${durSec}s)`,
            color: "#40c4ff",
            timer: 2400,
          };
        } else if (this.envEvent.type === "blizzard") {
          const dirText = this.envEvent.dir > 0 ? "➡️ (verso DX)" : "⬅️ (verso SX)";
          this.banner = {
            title: "❄️ BUFERA DI NEVE " + (this.envEvent.dir > 0 ? "➡️" : "⬅️"),
            subtitle: `Tormenta improvvisa ${dirText}! (${durSec}s)`,
            color: "#80d8ff",
            timer: 2400,
          };
        } else if (this.envEvent.type === "fog") {
          const dirText = this.envEvent.dir > 0 ? "➡️ (verso DX)" : "⬅️ (verso SX)";
          this.banner = {
            title: "🌫️ NEBBIONE BOLOGNESE " + (this.envEvent.dir > 0 ? "➡️" : "⬅️"),
            subtitle: `Fitta nebbia in quota ${dirText}! (${durSec}s)`,
            color: "#cfd8dc",
            timer: 2400,
          };
        }
      }
    }

    // Se l'evento è attualmente attivo, scala il timer di durata
    if (this.envEvent) {
      this.envEvent.remaining -= dt;
      if (this.envEvent.remaining <= 0) {
        // Durata conclusa (5-15s trascorsi): l'evento termina
        this.envEvent = null;
        this.quickCooldown = 8000 + Math.random() * 8000;
        this.banner = {
          title: "☀️ TORNA IL SERENO",
          subtitle: "L'evento speciale è terminato!",
          color: "#aed581",
          timer: 1600,
        };
      }
    }
  }

  levelName() { return (CONFIG.LEVELS[this.levelId] || {}).gem || "—"; }

  // Riempimento della BARRA MAGICA della scalata, 0..1 (`n / barFull`).
  barFraction() {
    const full = (CONFIG.LEVELS[this.levelId] || {}).barFull || 1;
    return Math.max(0, Math.min(1, this.climbScore / full));
  }
  // QUALITÀ del pezzo = soglie sulla barra magica -> indice in HOUSE_QUALITY_*.
  // Sostituisce i "lati splendenti" dell'originale: non condiziona il piazzamento, solo
  // il moltiplicatore di punti della consegna.
  pieceQuality() {
    const f = this.barFraction(), th = CONFIG.HOUSE_QUALITY_FRACTIONS;
    let q = 0;
    for (let i = 0; i < th.length; i++) if (f >= th[i]) q = i;
    return q;
  }
  // VALORE della gemma consegnata = min(n>>7, 32767). [SPEC §6.4, j.w()]
  gemValue() {
    return Math.min(this.climbScore >> CONFIG.GEM_VALUE_SHIFT, CONFIG.GEM_VALUE_CAP);
  }
  // Handoff ARCADE -> STRATEGICO: congela qualità e valore del pezzo, poi stato CART.
  handoffToCart() {
    this.deliveredQuality = this.pieceQuality();
    this.deliveredValue = this.gemValue();
    this.cart.start();
  }

  // Sistema 9: azzera punteggio/combo a inizio RUN (non a inizio sotto-piramide: il
  // punteggio attraversa le sotto-piramidi/città, SPEC §7).
  resetRunScore() {
    this.scoreInternal = 0;
    this.combo = 0; this.comboMax = 0; this.comboTimer = 0;
    this.climbScore = 0;
    this.climbElapsed = 0;
    this.rank = -1;
  }

  // Sistema 6 / Quick Mode: aggiornamento dinamico della velocità di oscillazione.
  // In Quick Mode: Perfetto = -5% (-1.6), Medio = 0%, Bordo = +5% (+1.6), clamp su [22, 42] (base 32 ± 10).
  // La nuova velocità viene ereditata dal ricevente `receiver` che effettuerà il prossimo lancio.
  applyCatchQualityToSpeed(quality, receiver) {
    if (this.mode === MODE.QUICK) {
      const base = CONFIG.SWING_SPEED_INIT; // 32
      const delta = base * 0.05; // 1.6 unità (5% della base)
      if (quality === CONFIG.QUALITY_PERFECT) {
        this.quickSwingSpeed = Math.max(22, this.quickSwingSpeed - delta);
      } else if (quality === CONFIG.QUALITY_EDGE) {
        this.quickSwingSpeed = Math.min(42, this.quickSwingSpeed + delta);
      }
      if (receiver) {
        receiver.swingSpeed = this.quickSwingSpeed;
      }
    } else {
      // In modalità Costruisci la Casetta (Empire), la velocità resta rigorosamente fissa a 32 unità
      if (receiver) receiver.swingSpeed = CONFIG.SWING_SPEED_INIT;
    }
  }

  // f251m[25]: tempo limite della scalata in ms (timeLimitSec dal file × 1000). [SPEC §2.1]
  get timeLimitMs() {
    const lvl = CONFIG.LEVELS[this.levelId];
    return (lvl ? lvl.timeLimitSec : 0) * CONFIG.TIME_MS_PER_UNIT;
  }
  // Scalata completata entro il tempo limite? (f251m[24] < f251m[25]) [LETTO j(int)]
  get withinTimeLimit() { return this.climbElapsed < this.timeLimitMs; }

  // f251m[24] += DCTriangle.c a ogni frame, ma SOLO finché la scalata non è completata
  // (`d != f222b.length-1`). [LETTO j.class — a(int)]
  tickClimbClock(dt) {
    if (!this.chain.climbDone) this.climbElapsed += dt;
  }

  // m91d(): BONUS DI TEMPO = (max(0, limite - trascorso)/1000)*256 >> 7 = 2 punti per
  // secondo risparmiato. Vale 0 finché la scalata non è completata. [LETTO j.class — d()]
  timeBonus() {
    if (!this.chain.climbDone) return 0;
    const left = Math.max(0, this.timeLimitMs - this.climbElapsed);
    return (Math.floor(left / CONFIG.TIME_MS_PER_UNIT) * CONFIG.TIME_BONUS_MUL) >> CONFIG.TIME_BONUS_SHIFT;
  }

  // Punteggio MOSTRATO = (n >> 7) + m91d(). [LETTO j.class — a()]
  get scoreDisplayed() {
    return (this.scoreInternal >> CONFIG.SCORE_DISPLAY_SHIFT) + this.timeBonus();
  }

  // §2.1: decadimento della finestra combo (`o()`, SPEC §7) — chiamato ogni frame nei
  // soli stati "in game" (SWING/FLY/LAND/MISS/CLIMB_DONE). Scaduta B<=0 -> azzera C.
  tickCombo(dt) {
    if (this.comboTimer <= 0) return;
    this.comboTimer -= dt;
    if (this.comboTimer <= 0) { this.comboTimer = 0; this.combo = 0; }
  }

  /* --- DOUBLE-FLY (SPEC §4.1 / §14.4) ------------------------------------------------ */

  // `m88c()` dell'originale: `g.c > 0 || f204c == 45` — rilancio sbloccato dopo la prima
  // piramide completata, oppure sempre in Quick (livello 45). [LETTO javap j.c() 0-17]
  // Nel layer semplificato la tappa strategica equivalente sono le FONDAMENTA finite
  // (DOUBLE_FLY_UNLOCK_PIECES): il gate cambia riferimento, il rilancio no.
  get doubleFlyUnlocked() {
    return this.house.count >= CONFIG.DOUBLE_FLY_UNLOCK_PIECES ||
           this.levelId === CONFIG.QUICK_LEVEL_INDEX;
  }

  // `n()`: m[9] = min(m[9]+1, 99). [LETTO javap j.n() offset 0-18]
  grantDoubleFlyCharge() {
    this.doubleFlyCharges = Math.min(this.doubleFlyCharges + 1, CONFIG.DOUBLE_FLY_CAP);
  }

  // Comando d'azione durante il VOLO -> tenta il rilancio. Ramo `f251m[8] != 0` di `p()`.
  // Se una qualunque condizione non è soddisfatta la `p()` originale fa `return` SENZA
  // toccare nulla: niente carica consumata, niente contatore incrementato.
  // [LETTO javap j.p() offset 0-64, 83-95, 245-322]
  tryDoubleFly() {
    const s = this.stone;
    if (!s.active || s.caught || s.fell) return false;
    if (this.flightLaunches === 0) return false;                    // i2 == 0: non è il rilancio
    if (!this.doubleFlyUnlocked) return false;                      // c()
    if (this.doubleFlyCharges === 0) return false;                  // m[9] != 0
    // finestra: v_corr >= (v0y_stadio * 90)/100, entrambe negative (divisione intera troncata).
    if (s.vyNow < Math.trunc(s.v0y * CONFIG.DOUBLE_FLY_WINDOW_PCT / 100)) return false;
    if (this.chain.climbDone) return false;                         // d == b.length-1 -> return
    this.doubleFlyCharges--;                                        // m[9]--
    // Il rilancio ripercorre lo STESSO blocco 104-159 di p(): rilegge `e[d].c` e poi fa
    // (v*90)/100 [LETTO j.p() offset 245-252]. Nominale = classe del LANCIATORE, invariata
    // durante il volo (d non cambia finche' non c'e' la presa).
    s.relaunch(Physics.v0yForClass(s.throwerCls));                  // i3 = (i3*90)/100 sul NOMINALE
    this.flightLaunches++;                                          // m[8]++
    this.audio.launch();
    return true;
  }

  // Sistema 9 — punteggio per PRESA riuscita (SPEC §7, j.m86j 1324-1337). Chiamato a
  // ogni catch (ingresso LAND), non solo al deposito in piramide: nell'originale il
  // punteggio si accredita per ogni presa lungo la catena di operai.
  //   i27 = (i25 + C) << 7        i25 = 3 (perfetto/medio) o 2 (bordo); C = combo PRIMA di questa presa
  //   DOUBLE-FLY: se m[8] > 1 (presa dopo un RILANCIO) e i13 != 0 -> i27 = i27*250/100
  //   i28 = i27 * scoreMult/100   scoreMult = SCORE_MULT_DEFAULT_PCT (100, DA STIMARE: dati livello reali ignoti)
  //   + bonus chiusura Empire +5% se questa presa completa la piramide senza errori (f251m[24]<f251m[25], DEDOTTO)
  //   n += i28 ; combo: PERFETTO riapre/riavvia la finestra B; se B>0 alla presa, C++ (D=max(D,C))
  applyCatchScore(quality, closesEmpirePyramid, doubleFlyBonus) {
    if (quality === CONFIG.QUALITY_MISS || quality < 0) return { gained: 0, closeBonus: false };
    if (this.mode === MODE.EMPIRE && quality === CONFIG.QUALITY_PERFECT) {
      this.empirePerfectCount++;
    }
    const i25 = (quality === CONFIG.QUALITY_EDGE) ? CONFIG.SCORE_MULT_EDGE : CONFIG.SCORE_MULT_GOOD;
    const comboBefore = this.combo;
    let i27 = (i25 + comboBefore) << CONFIG.SCORE_SHIFT;
    // Il ×2,5 sta ESATTAMENTE qui: dopo la combo e lo <<7, prima del moltiplicatore di
    // livello e del bonus di chiusura. Aritmetica intera *250/100.
    // [LETTO javap j(int) offset 1111-1136]
    if (doubleFlyBonus) i27 = Math.floor(i27 * CONFIG.DOUBLE_FLY_SCORE_PCT / 100);
    let i28 = Math.floor(i27 * CONFIG.SCORE_MULT_DEFAULT_PCT / 100);
    let closeBonus = false;
    // +5% di chiusura: ultimo operaio E cronometro sotto il limite. [LETTO j(int):
    // `if (idx == b.length-1 && m[24] < m[25]) i28 += (n+i28)*5/100`]
    if (this.mode === MODE.EMPIRE && closesEmpirePyramid && this.withinTimeLimit) {
      i28 += Math.floor((this.scoreInternal + i28) * CONFIG.CLOSE_BONUS_PCT / 100);
      closeBonus = true;
    }
    this.scoreInternal += i28;
    this.climbScore += i28;          // `n` della scalata -> barra magica (m83c/w())
    if (quality === CONFIG.QUALITY_PERFECT) this.comboTimer = CONFIG.COMBO_WINDOW_MS;
    if (this.comboTimer > 0) { this.combo++; this.comboMax = Math.max(this.comboMax, this.combo); }
    return { gained: i28, closeBonus };
  }

  // RANK finale (g.h()): soglia più alta raggiunta dal punteggio TOTALE, solo a città
  // finita. [SPEC §6.3, RANK_THRESHOLDS]
  computeRank() {
    let m = 0;
    for (let i = 0; i < CONFIG.RANK_THRESHOLDS.length; i++) {
      if (this.scoreDisplayed >= CONFIG.RANK_THRESHOLDS[i]) m = i;
    }
    return m;
  }

  // Sistema 11 — salvataggio persistente e sala record (localStorage).
  loadStats() {
    const def = {
      empire: {
        completedHouses: 0,
        montagnaHouses: 0,
        palmaHouses: 0,
        bolognaHouses: 0,
        bestScore: 0,
        bestRank: -1,
        bestTimeMs: null,
        maxPerfects: 0,
      },
      quick: {
        highScore: Number(localStorage.getItem("pb_highscore_quick") || 0),
        maxFloors: 0,
        maxCombo: 0,
      }
    };
    try {
      const raw = localStorage.getItem("pb_stats_v2");
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed.empire) Object.assign(def.empire, parsed.empire);
        if (parsed.quick) Object.assign(def.quick, parsed.quick);
      }
    } catch (e) {
      console.warn("Errore lettura stats:", e);
    }
    return def;
  }

  saveStats() {
    try {
      localStorage.setItem("pb_stats_v2", JSON.stringify(this.stats));
      localStorage.setItem("pb_highscore_quick", String(this.stats.quick.highScore));
      this.highScore = this.stats.quick.highScore;
    } catch (e) {
      console.warn("Errore salvataggio stats:", e);
    }
  }

  saveEmpireVictory() {
    this.stats.empire.completedHouses++;
    if (this.scenario === "montagna") this.stats.empire.montagnaHouses++;
    else if (this.scenario === "palma") this.stats.empire.palmaHouses++;
    else if (this.scenario === "bologna") this.stats.empire.bolognaHouses = (this.stats.empire.bolognaHouses || 0) + 1;

    if (this.scoreDisplayed > this.stats.empire.bestScore) {
      this.stats.empire.bestScore = this.scoreDisplayed;
    }
    if (this.rank > this.stats.empire.bestRank) {
      this.stats.empire.bestRank = this.rank;
    }
    const totalMs = this.empireStartTime ? (Date.now() - this.empireStartTime) : null;
    if (totalMs && (!this.stats.empire.bestTimeMs || totalMs < this.stats.empire.bestTimeMs)) {
      this.stats.empire.bestTimeMs = totalMs;
    }
    if (this.empirePerfectCount > this.stats.empire.maxPerfects) {
      this.stats.empire.maxPerfects = this.empirePerfectCount;
    }
    this.saveStats();
  }

  saveHighScore() {
    if (this.mode === MODE.QUICK) {
      if (this.scoreDisplayed > this.stats.quick.highScore) {
        this.stats.quick.highScore = this.scoreDisplayed;
      }
      if (this.quickFloors > this.stats.quick.maxFloors) {
        this.stats.quick.maxFloors = this.quickFloors;
      }
      if (this.comboMax > this.stats.quick.maxCombo) {
        this.stats.quick.maxCombo = this.comboMax;
      }
      this.saveStats();
    }
  }
  // --- Camera (SPEC §6.5): offset MONDO che insegue l'operaio corrente. ---
  // schermo = mondo - cameraY. Tenendo il LANCIATORE corrente a CHAIN_ANCHOR_Y, la
  // geometria di lancio/presa dei sistemi 4-6 resta identica a ogni gradino della catena.
  cameraTargetFor(index) { return this.chain.workerWorldY(index) - CONFIG.CHAIN_ANCHOR_Y; }

  resetCamera() {
    this.cameraY = this.cameraTargetFor(this.chain.current);
    this._panning = false;
    this._panFrom = this.cameraY; this._panTo = this.cameraY;
    this._panElapsed = 0; this._panDur = 0;
  }
  // Pan verso l'operaio corrente (a ogni ingresso in SWING la catena è salita di un TILE).
  panCameraToCurrentWorker() {
    const to = this.cameraTargetFor(this.chain.current);
    if (Math.abs(to - this.cameraY) < 0.001) { this.cameraY = to; this._panning = false; return; }
    this.startPan(this.cameraY, to);
  }
  // Avvia un pan da `from` a `to` (px). Durata = max(|Δ|*1000/CAMERA_PAN_DUR_DIV, 1) ms.
  startPan(from, to) {
    this._panFrom = from; this._panTo = to;
    this._panElapsed = 0;
    this._panDur = Math.max(Math.abs(to - from) * 1000 / CONFIG.CAMERA_PAN_DUR_DIV, 1);
    this._panning = true;
    this.cameraY = from;
  }
  // §2.1 g: avanza il pan di dt; cameraY segue la curva Catmull-Rom fino a `to`.
  updateCamera(dt) {
    if (!this._panning) return;
    this._panElapsed += dt;
    let u = this._panElapsed / this._panDur;            // parametro normalizzato 0..1
    if (u >= 1) { u = 1; this._panning = false; }
    this.cameraY = catmullPan(this._panFrom, this._panTo, u);
  }

  // Loop: render ogni frame; update SOLO quando delta >= FRAME_GATE_MS.
  frame(now) {
    if (this.lastUpdate === 0) this.lastUpdate = now;
    const delta = now - this.lastUpdate;

    if (delta >= CONFIG.FRAME_GATE_MS) {                  // GATE 25 ms (SPEC §1)
      const dt = Math.min(delta, CONFIG.DELTA_CLAMP_MS);  // clamp 200 ms
      this.lastUpdate = now;
      this.lastDt = dt;

      // fps stimati sui tick di update.
      this._fpsAcc += dt; this._fpsFrames++;
      if (this._fpsAcc >= 500) {
        this.fps = (this._fpsFrames * 1000) / this._fpsAcc;
        this._fpsAcc = 0; this._fpsFrames = 0;
      }

      // #1 assoluto: poll input a inizio frame logico (ARCH §2.1).
      this.input.poll();
      if (this.input.any() || this.input.lastClicked) {
        this.audio.ensureBGM();
      }
      // #2: 1 frame logico = aggiorna esattamente UNO stato (legge l'input).
      this.sm.update(dt);
    }

    // Render-pass (legge lo stato, non lo modifica).
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const targetW = Math.round(240 * dpr);
    const targetH = Math.round(320 * dpr);
    if (this.canvas.width !== targetW || this.canvas.height !== targetH) {
      this.canvas.width = targetW;
      this.canvas.height = targetH;
    }
    this.ctx.save();
    this.ctx.scale(dpr, dpr);
    this.ctx.imageSmoothingEnabled = false;

    this.sm.render(this.ctx);

    this.ctx.restore();

    requestAnimationFrame((t) => this.frame(t));
  }

  start() {
    requestAnimationFrame((t) => this.frame(t));
  }
}

function fitGameToScreen() {
  const canvas = document.getElementById("game");
  if (!canvas) return;
  const container = canvas.parentElement || document.querySelector(".canvas-container");
  if (!container) return;
  const rect = container.getBoundingClientRect();
  const availableW = Math.floor(rect.width);
  const availableH = Math.floor(rect.height);
  if (availableW <= 0 || availableH <= 0) return;

  // Strict 3:4 Aspect Ratio (240 / 320 = 0.75)
  let targetW = availableW;
  let targetH = Math.floor(targetW * (4 / 3));

  if (targetH > availableH) {
    targetH = availableH;
    targetW = Math.floor(targetH * (3 / 4));
  }

  targetW = Math.max(120, targetW);
  targetH = Math.max(160, targetH);

  canvas.style.width = targetW + "px";
  canvas.style.height = targetH + "px";
}

if (typeof window.ResizeObserver !== "undefined") {
  const container = document.querySelector(".canvas-container");
  if (container) {
    new ResizeObserver(() => fitGameToScreen()).observe(container);
  }
}
window.addEventListener("resize", fitGameToScreen);
window.addEventListener("orientationchange", () => {
  setTimeout(fitGameToScreen, 60);
  setTimeout(fitGameToScreen, 150);
});
window.addEventListener("DOMContentLoaded", fitGameToScreen);
setTimeout(fitGameToScreen, 20);
setTimeout(fitGameToScreen, 100);
setTimeout(fitGameToScreen, 300);

/* ---- bootstrap ---- */
const game = new Game(document.getElementById("game"));
Assets.load().then(() => {
  if (Assets.failed) console.warn("[Sistema 15] sprite non caricati: " + Assets.failed +
                                  "/" + SPRITES.files.length + " — servire la pagina via HTTP, non file://");
});
game.start();
